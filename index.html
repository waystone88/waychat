/* ============================================================
   WayChat — crafted layer
   Warm ink-and-paper system: paper ground, warm charcoal ink,
   terracotta accent, serif display for titles and the greeting.
   ============================================================ */

/* --- scrollbars: slim, warm, unobtrusive --- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CFC4AB; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #B4A888; }
.dark ::-webkit-scrollbar-thumb { background: #4A4438; }
.dark ::-webkit-scrollbar-thumb:hover { background: #655C4C; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

button { cursor: pointer; }
input, textarea, select, button { font-family: inherit; }

/* --- sidebar craft --- */
#sidebar {
    background: linear-gradient(180deg, var(--side) 0%, color-mix(in srgb, var(--side) 86%, var(--bg)) 100%);
}
#sidebar h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; }
#sidebar > div:last-child > button:first-child {
    background: var(--accent); color: #FFF6EA;
    box-shadow: var(--sh-bubble);
}
#sidebar > div:last-child > button:first-child:hover { background: var(--accent-2); }
#sessions-list > div { transition: background-color .15s ease; }

/* --- modal titles in serif --- */
#settings-modal h2, #world-matrix-modal h2, #trash-modal h2,
#edit-prompt-modal h2, #edit-message-modal h2 {
    font-family: var(--font-display); font-weight: 600; letter-spacing: .03em;
}
#settings-modal > div, #world-matrix-modal > div, #trash-modal > div { border: 1px solid var(--line); }

/* --- reading column --- */
#chat-container > div { max-width: 54rem; }

/* --- message typography --- */
.message-content { -webkit-user-select: text; user-select: text; line-height: 1.8; }
.message-content pre {
    padding: 1rem 1.1rem; border-radius: .9rem;
    background-color: #221E19; color: #E9E2D2;
    overflow-x: auto; font-size: .875em; line-height: 1.6;
    border: 1px solid rgba(255,255,255,.06);
}
.message-content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
.message-content :not(pre) > code {
    background: var(--well); border-radius: 5px; padding: .12em .38em;
}
.message-content p { margin: .55em 0; }
.message-content p:first-child { margin-top: 0; }
.message-content p:last-child { margin-bottom: 0; }
.message-content ul, .message-content ol { margin: .55em 0; padding-left: 1.4em; }
.message-content li { margin: .3em 0; }
.message-content h1, .message-content h2, .message-content h3, .message-content h4 {
    font-weight: 700; line-height: 1.35; margin: 1em 0 .5em;
}
.message-content h1:first-child, .message-content h2:first-child, .message-content h3:first-child { margin-top: 0; }
.message-content blockquote {
    border-left: 3px solid var(--gold); margin: .8em 0; padding: .2em 0 .2em 1em;
    color: var(--ink-2);
}
.message-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.dark .message-content a { color: var(--accent-bright); }
.message-content hr { border-color: var(--line); margin: 1.2em 0; }
.message-content table { font-size: .9em; }
.message-content thead th { border-bottom: 2px solid var(--line); }
.message-content tbody td { border-bottom: 1px solid var(--line-soft); }
.prose p:first-child { margin-top: 0; }
.prose p:last-child { margin-bottom: 0; }

/* --- typing cursor --- */
.typing-indicator::after { content: '▋'; animation: wc-blink 1s step-start infinite; color: var(--accent); }
@keyframes wc-blink { 50% { opacity: 0; } }

details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }

input[type=range] { accent-color: var(--accent); }

/* --- selected cards --- */
.card-checkbox:checked + div {
    border-color: var(--accent); background-color: var(--accent-soft);
    box-shadow: var(--sh-bubble);
}

/* --- focus: soft warm ring instead of hard outline --- */
input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: none !important;
    box-shadow: 0 0 0 3px rgba(154, 63, 44, .16) !important;
}
.dark input:focus, .dark textarea:focus, .dark select:focus, .dark button:focus-visible {
    box-shadow: 0 0 0 3px rgba(201, 111, 74, .22) !important;
}
#message-input:focus { box-shadow: none !important; }

/* --- user bubble: deep terracotta, tailored corner --- */
.bubble-user {
    background: linear-gradient(155deg, #AC4C30 0%, var(--accent) 55%, var(--accent-2) 100%);
    color: #FFF8EE;
    border-bottom-right-radius: 8px;
    box-shadow: 0 1px 2px rgba(126, 50, 34, .35), 0 8px 22px -8px rgba(126, 50, 34, .45);
}
.bubble-user a { color: #FFE3C2 !important; }
.bubble-user code { background: rgba(255,255,255,.16); border-radius: 4px; padding: .1em .35em; }
.dark .bubble-user {
    background: linear-gradient(155deg, #CE7A52 0%, #B85F3A 55%, #9A4A2C 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 22px -8px rgba(0,0,0,.6);
}

/* --- empty-state greeting: quiet serif, small ornament --- */
.empty-greeting { animation: wc-rise .55s cubic-bezier(.22,.8,.32,1) both; }
.empty-greeting::before {
    content: ''; display: block; width: 9px; height: 9px; margin-bottom: 26px;
    background: var(--accent); transform: rotate(45deg);
    box-shadow: 0 0 0 5px var(--accent-soft);
}
.empty-greeting h2 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 2.6rem; line-height: 1.2; letter-spacing: .05em; color: var(--ink);
}
@keyframes wc-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
    .empty-greeting { animation: none; }
    .typing-indicator::after { animation: none; }
}

/* --- scroll-to-bottom: resting state is fully non-rendered;
       the scroll handler removes .opacity-0 to reveal it --- */
#scroll-to-bottom-btn.opacity-0 { display: none; }

/* --- coverage patch: remaining alpha/size utilities --- */
.-m-1 { margin: -.25rem; }
.w-9 { width: 2.25rem; }
.h-9 { height: 2.25rem; }

    <script>
        (function () {
            var dlg = document.getElementById('wc-dialog');
            var txt = document.getElementById('wc-dialog-text');
            var inp = document.getElementById('wc-dialog-input');
            var okBtn = document.getElementById('wc-dialog-ok');
            var cancelBtn = document.getElementById('wc-dialog-cancel');
            var resolver = null, kind = 'confirm';
            function settle(v) {
                dlg.classList.add('hidden');
                var r = resolver; resolver = null;
                if (r) r(v);
            }
            okBtn.addEventListener('click', function () { settle(kind === 'prompt' ? inp.value : true); });
            cancelBtn.addEventListener('click', function () { settle(kind === 'prompt' ? null : false); });
            dlg.addEventListener('click', function (e) { if (e.target === dlg) settle(kind === 'prompt' ? null : false); });
            inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); okBtn.click(); } });
            window.uiConfirm = function (message) {
                return new Promise(function (resolve) {
                    resolver = resolve; kind = 'confirm';
                    txt.textContent = message;
                    inp.classList.add('hidden');
                    dlg.classList.remove('hidden');
                });
            };
            window.uiPrompt = function (message, def) {
                return new Promise(function (resolve) {
                    resolver = resolve; kind = 'prompt';
                    txt.textContent = message;
                    inp.value = def || '';
                    inp.classList.remove('hidden');
                    dlg.classList.remove('hidden');
                    setTimeout(function () { inp.focus(); inp.select(); }, 60);
                });
            };
            var toastTimer = null;
            window.showToast = function (message) {
                var t = document.getElementById('wc-toast');
                t.textContent = message;
                t.classList.remove('hidden');
                requestAnimationFrame(function () { t.classList.remove('opacity-0'); });
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    t.classList.add('opacity-0');
                    setTimeout(function () { t.classList.add('hidden'); }, 320);
                }, 2200);
            };
        })();
    </script>

        let sidebarOpen = false;

        let draftSystemPrompt = null;

        function getMatrixContext() {
            if (matrixMode === 'draft') {
                return {
                    systemPrompt: draftSystemPrompt,
                    activeCharacters: draftCharacters,
                    activePlots: draftPlots
                };
            }
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            return activeSession || null;
        }

        function init() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            
            try {
                const savedState = localStorage.getItem('deepseek_client_state_v28');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    state = { ...state, ...parsed };
                    state.config = { ...{provider: 'deepseek', apiUrl: 'https://api.deepseek.com/v1', apiKey: '', model: 'deepseek-v4-flash', deepseekApiUrl: 'https://api.deepseek.com/v1', deepseekApiKey: '', deepseekModel: 'deepseek-v4-flash', glmApiUrl: 'https://api.z.ai/api/paas/v4', glmApiKey: '', glmModel: 'glm-5.3-flash', kimiApiUrl: 'https://api.moonshot.cn/v1', kimiApiKey: '', kimiModel: 'kimi-k2.6', darkMode: false, thinkingMode: false, temperature: 1.0, maxTokens: 8000, historyTurns: 20, fontSize: 16, uiFontSize: 16}, ...parsed.config };
                    if (!state.config.deepseekApiKey) state.config.deepseekApiKey = state.config.apiKey || '';

                    if (!Array.isArray(state.config.glmModels) || state.config.glmModels.length === 0) state.config.glmModels = [state.config.glmModel || 'glm-5.3-flash'];
                    if (!Array.isArray(state.config.kimiModels) || state.config.kimiModels.length === 0) state.config.kimiModels = [state.config.kimiModel || 'kimi-k2.6'];
                    if (state.config.deepseekModel && !state.config.deepseekModels.includes(state.config.deepseekModel)) state.config.deepseekModels.push(state.config.deepseekModel);
                    if (state.config.glmModel && !state.config.glmModels.includes(state.config.glmModel)) state.config.glmModels.push(state.config.glmModel);
                    if (state.config.kimiModel && !state.config.kimiModels.includes(state.config.kimiModel)) state.config.kimiModels.push(state.config.kimiModel);
                    // 清洗：按模型名前缀把放错桶的收藏搬回正确桶
                    const dsRaw = state.config.deepseekModels || [];
                    const glRaw = state.config.glmModels || [];
                    const kiRaw = state.config.kimiModels || [];
                    state.config.deepseekModels = [...new Set(dsRaw.filter(m => /^deepseek/i.test(m)))];
                    state.config.glmModels = [...new Set(glRaw.filter(m => /^glm/i.test(m)))];
                    state.config.kimiModels = [...new Set(kiRaw.filter(m => /^(kimi|moonshot)/i.test(m)))];
                    dsRaw.forEach(m => { if (/^glm/i.test(m) && !state.config.glmModels.includes(m)) state.config.glmModels.push(m); if (/^(kimi|moonshot)/i.test(m) && !state.config.kimiModels.includes(m)) state.config.kimiModels.push(m); });
                    glRaw.forEach(m => { if (/^deepseek/i.test(m) && !state.config.deepseekModels.includes(m)) state.config.deepseekModels.push(m); if (/^(kimi|moonshot)/i.test(m) && !state.config.kimiModels.includes(m)) state.config.kimiModels.push(m); });
                    kiRaw.forEach(m => { if (/^deepseek/i.test(m) && !state.config.deepseekModels.includes(m)) state.config.deepseekModels.push(m); if (/^glm/i.test(m) && !state.config.glmModels.includes(m)) state.config.glmModels.push(m); });

                    if (state.config.glmModels.length === 0) state.config.glmModels = ['glm-5.3-flash'];
                    if (state.config.kimiModels.length === 0) state.config.kimiModels = ['kimi-k2.6'];

                    if (!/^glm/i.test(state.config.glmModel || '')) state.config.glmModel = state.config.glmModels[0];
                    if (!/^(kimi|moonshot)/i.test(state.config.kimiModel || '')) state.config.kimiModel = state.config.kimiModels[0];

                        state.config.apiUrl = state.config.deepseekApiUrl || 'https://api.deepseek.com/v1';
                        state.config.apiKey = state.config.deepseekApiKey || '';
                    } else if (provClean === 'glm' && !/^glm/i.test(state.config.model || '')) {
                        state.config.model = state.config.glmModel;
                        state.config.apiUrl = state.config.glmApiUrl || 'https://api.z.ai/api/paas/v4';
                        state.config.apiKey = state.config.glmApiKey || '';
                    } else if (provClean === 'kimi' && !/^(kimi|moonshot)/i.test(state.config.model || '')) {
                        state.config.model = state.config.kimiModel;
                        state.config.apiUrl = state.config.kimiApiUrl || 'https://api.moonshot.cn/v1';
                        state.config.apiKey = state.config.kimiApiKey || '';
                    } else if (provClean === 'deepseek' && !/^deepseek/i.test(state.config.model || '')) {
                        state.config.model = state.config.deepseekModel;
                        state.config.apiUrl = state.config.deepseekApiUrl || 'https://api.deepseek.com/v1';
                        state.config.apiKey = state.config.deepseekApiKey || '';
                    }
                    if(parsed.prompts && !parsed.systemCards) state.systemCards = parsed.prompts;
                    if(!state.characterCards) state.characterCards = [];
                    if(!state.plotCards) state.plotCards = [];
                    if(!state.trash) state.trash = [];
                    if(parsed.draftSystemPrompt !== undefined) draftSystemPrompt = parsed.draftSystemPrompt;
                    if(parsed.draftCharacters) draftCharacters = parsed.draftCharacters;
                    if(parsed.draftPlots) draftPlots = parsed.draftPlots;
                } else {
                    const fallbacks = ['deepseek_client_state_v26', 'deepseek_client_state_v22', 'deepseek_client_state_v18'];
                    for (const fb of fallbacks) {
                        const d = localStorage.getItem(fb);
                        if(d) { state = JSON.parse(d); break; }
                    }
                }
                
                if (window.matchMedia) {
                    state.config.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                saveState();
            } catch (e) {
                console.error("State parse error", e);
            }

            state.sessions = state.sessions.filter(s => s.messages && s.messages.length > 0);
            createNewSession(false);
            
            state.sessions.forEach(s => {
                if(!s.activeCharacters) s.activeCharacters = [];
                if(!s.activePlots) s.activePlots = [];
                if(!s.updatedAt) s.updatedAt = parseInt(s.id) || Date.now();
            });

            const toggleElement = document.getElementById('thinking-mode-toggle');
            if (toggleElement) toggleElement.checked = !!state.config.thinkingMode;
            
            applyDarkMode(); 
            applyUiFontSize();
            renderSessions(); 
            renderChat();
            updateThinkingBulbUI();
            renderModelSelector();
            
            if (typeof marked !== 'undefined') {
                marked.setOptions({ breaks: true, gfm: true });
            }

            setTimeout(() => {
                userScrolledUp = false;
                scrollToBottom();
                const btn = document.getElementById('scroll-to-bottom-btn');
                if(btn) {
                    btn.classList.add('opacity-0', 'scale-90', 'translate-y-2', 'pointer-events-none');
                    btn.classList.remove('opacity-100', 'scale-100', 'translate-y-0', 'pointer-events-auto');
                }
                nudgeHitTest();
            }, 50);
        }

        function saveState() {
            try {
                localStorage.setItem('deepseek_client_state_v28', JSON.stringify({
                    config: state.config, 
                    sessions: state.sessions, 
                    activeSessionId: state.activeSessionId, 
                    systemCards: state.systemCards,
                    characterCards: state.characterCards,
                    plotCards: state.plotCards,
                    draftSystemPrompt: draftSystemPrompt,
                    draftCharacters: draftCharacters,
                    draftPlots: draftPlots,
                    trash: state.trash
                }));
            } catch (e) {
                console.error('localStorage save failed:', e);
                if (e.name === 'QuotaExceededError') {
                    showToast('存储空间已满（5MB 上限）。建议导出部分对话后删除，释放空间。');
                }
            }
        }

        function applyUiFontSize() {
            const base = state.config.uiFontSize || 16;
            const lg = Math.round(base * 1.125);
            const xl = Math.round(base * 1.25);
            const text2xl = Math.round(base * 1.5);
            const sm = Math.round(base * 0.875);
            const xs = Math.round(base * 0.75);
            const inputSize = Math.max(16, base);
            const editLine = Math.round(inputSize * 1.5);

            const style = document.getElementById('ui-font-style') || document.createElement('style');

                #sidebar, #world-matrix-modal, #settings-modal, #matrix-popover, #edit-prompt-modal, #edit-message-modal, #session-action-menu { font-size: ${base}px !important; }
                #sidebar .text-2xl, #world-matrix-modal .text-2xl, #settings-modal .text-2xl, #edit-prompt-modal .text-2xl, #edit-message-modal .text-2xl, #session-action-menu .text-2xl { font-size: ${text2xl}px !important; line-height: 1.2 !important; }
                #sidebar .text-xl, #world-matrix-modal .text-xl, #settings-modal .text-xl, #edit-prompt-modal .text-xl, #edit-message-modal .text-xl, #session-action-menu .text-xl { font-size: ${xl}px !important; line-height: 1.4 !important; }
                #sidebar .text-lg, #world-matrix-modal .text-lg, #settings-modal .text-lg, #matrix-popover .text-lg, #edit-prompt-modal .text-lg, #edit-message-modal .text-lg, #session-action-menu .text-lg { font-size: ${lg}px !important; line-height: 1.5 !important; }
                #sidebar .text-base, #world-matrix-modal .text-base, #settings-modal .text-base, #matrix-popover .text-base, #edit-prompt-modal .text-base, #edit-message-modal .text-base, #session-action-menu .text-base { font-size: ${base}px !important; line-height: 1.5 !important; }
                #sidebar .text-sm, #world-matrix-modal .text-sm, #settings-modal .text-sm, #matrix-popover .text-sm, #edit-prompt-modal .text-sm, #edit-message-modal .text-sm, #session-action-menu .text-sm { font-size: ${sm}px !important; line-height: 1.5 !important; }
                #sidebar .text-xs, #world-matrix-modal .text-xs, #settings-modal .text-xs, #matrix-popover .text-xs, #edit-prompt-modal .text-xs, #edit-message-modal .text-xs, #session-action-menu .text-xs { font-size: ${xs}px !important; line-height: 1.5 !important; }
                
                input[type=text], input[type=password], textarea, select { font-size: ${inputSize}px !important; }

            if (!document.getElementById('ui-font-style')) {

        let pressTimer = null;
        let pressStartX = 0;
        let pressStartY = 0;
        let isLongPress = false;
        let currentActionSessionId = null;

        function startSessionPress(e, id) {
            isLongPress = false;
            pressStartX = e.touches ? e.touches[0].clientX : e.clientX;
            pressStartY = e.touches ? e.touches[0].clientY : e.clientY;
            const targetEl = e.currentTarget; 
            
            pressTimer = setTimeout(() => {
                isLongPress = true;
                if (navigator.vibrate) navigator.vibrate(50);
                openSessionContextMenu(id, targetEl);
            }, 500); 
        }

        function cancelSessionPress(e) {
            if (!pressTimer) return;
            if (e) {
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const currentY = e.touches ? e.touches[0].clientY : e.clientY;
                if (Math.abs(currentX - pressStartX) < 10 && Math.abs(currentY - pressStartY) < 10) {
                    return; 
                }
            }
            clearTimeout(pressTimer);
            pressTimer = null;
        }

        function endSessionPress(e) {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        function handleSessionClick(e, id) {
            if (isLongPress) {
                isLongPress = false;
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            switchSession(id);
        }

        function openSessionContextMenu(id, targetEl) {
            currentActionSessionId = id;
            const menu = document.getElementById('session-action-menu');
            
            menu.classList.remove('hidden');
            
            const rect = targetEl.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect(); 
            
            let top = rect.bottom; 
            let left = rect.left + 20; 
            
            if (top + menuRect.height > window.innerHeight) {
                top = rect.top - menuRect.height;
                menu.style.transformOrigin = "bottom left";
            } else {
                menu.style.transformOrigin = "top left";
            }
            
            menu.style.top = top + 'px';
            menu.style.left = left + 'px';
            
            requestAnimationFrame(() => {
                menu.classList.remove('scale-95', 'opacity-0');
                menu.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeSessionContextMenu() {
            const menu = document.getElementById('session-action-menu');
            if (!menu || menu.classList.contains('hidden')) return;
            
            menu.classList.remove('scale-100', 'opacity-100');
            menu.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                menu.classList.add('hidden');
            }, 200); 
            
            currentActionSessionId = null;
        }

        function renameActiveActionSession() {
            if (!currentActionSessionId) return;
            const session = state.sessions.find(s => s.id === currentActionSessionId);
            if (!session) return;
            
            closeSessionContextMenu(); 
            
            setTimeout(async () => {
                const newTitle = await uiPrompt("重命名对话：", session.title);
                if (newTitle !== null && newTitle.trim() !== '') {
                    session.title = newTitle.trim();
                    saveState();
                    renderSessions();
                }
            }, 250); 
        }

        function downloadActiveActionSession() {
            if (!currentActionSessionId) return;
            const id = currentActionSessionId;
            closeSessionContextMenu();
            setTimeout(() => {
                exportMarkdown(id, null);
            }, 200);
        }

        function deleteActiveActionSession() {
            if (!currentActionSessionId) return;
            const id = currentActionSessionId;
            closeSessionContextMenu();
            
            setTimeout(async () => {
                if(!(await uiConfirm('确定要删除此对话吗？将移入回收站，可随时找回。'))) return;
                const target = state.sessions.find(s => s.id === id);
                if (target) {
                    if (!state.trash) state.trash = [];
                    state.trash.push({ session: target, deletedAt: Date.now() });
                    if (state.trash.length > 10) state.trash = state.trash.slice(-10);
                }
                state.sessions = state.sessions.filter(s => s.id !== id);
                if (state.activeSessionId === id) state.activeSessionId = state.sessions.length > 0 ? state.sessions[0].id : null;
                if (state.sessions.length === 0) createNewSession(false);
                renderSessions(); 
                renderChat(); 
                saveState();
            }, 200);
        }

        function openTrashModal() {
            renderTrashList();
            openModal('trash-modal');
            if(window.innerWidth < 768) toggleSidebar();
        }

        function renderTrashList() {
            const container = document.getElementById('trash-list');
            if (!container) return;
            const list = state.trash || [];
            if (list.length === 0) {
                container.innerHTML = '<div class="text-center text-stone-400 py-10 text-base">回收站是空的</div>';
                return;
            }
            container.innerHTML = list.slice().reverse().map(item => {
                const s = item.session || {};
                const count = (s.messages || []).length;
                return `
                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 dark:bg-stone-800/60 border border-stone-100 dark:border-stone-800 mb-2">
                    <div class="flex-1 min-w-0">
                        <div class="truncate text-base font-medium text-ink dark:text-stone-100">${escapeHTML(s.title || '未命名对话')}</div>
                        <div class="text-xs text-stone-400 mt-0.5">删除于 ${formatDeletedTime(item.deletedAt)} · ${count} 条消息</div>
                    </div>
                    <button onclick="restoreFromTrash('${s.id}')" class="ml-3 shrink-0 px-3.5 py-1.5 rounded-full text-sm font-bold text-indigo-600 dark:text-indigo-400 border border-indigo-300/60 dark:border-indigo-500/50 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-all">恢复</button>
                </div>`;
            }).join('');
        }

        function restoreFromTrash(id) {
            const idx = (state.trash || []).findIndex(t => t.session && t.session.id === id);
            if (idx === -1) return;
            const item = state.trash[idx];
            state.trash.splice(idx, 1);
            state.sessions.unshift(item.session);
            state.activeSessionId = item.session.id;
            closeModal('trash-modal');
            renderSessions();
            renderChat();
            saveState();
        }

        async function clearTrash() {
            if ((state.trash || []).length === 0) return;
            if(!(await uiConfirm('确定清空回收站？此操作不可恢复。'))) return;
            state.trash = [];
            renderTrashList();
            saveState();
        }

        function formatDeletedTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            const pad = n => String(n).padStart(2, '0');
            return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function toggleMatrixPopover(event) {
            if(event) event.stopPropagation();
            const popover = document.getElementById('matrix-popover');
            if(popover.classList.contains('hidden')) {
                renderMatrixPopover();
                popover.classList.remove('hidden');
            } else {
                closeMatrixPopover();
            }
        }

        function closeMatrixPopover() {
            document.getElementById('matrix-popover')?.classList.add('hidden');
        }

        function formatModelName(model) {
            const spaced = (model || '').replace(/-/g, ' ');
            return spaced.charAt(0).toUpperCase() + spaced.slice(1);
        }

        function renderModelSelector() {
            const label = document.getElementById('model-selector-label');
            if (label) label.innerText = formatModelName(state.config.model || 'deepseek-v4-flash');
        }

        function toggleModelPopover(event) {
            if (event) event.stopPropagation();
            const popover = document.getElementById('model-popover');
            if (popover.classList.contains('hidden')) {
                renderModelPopover();
                popover.classList.remove('hidden');
            } else {
                closeModelPopover();
            }
        }

        function closeModelPopover() {
            document.getElementById('model-popover')?.classList.add('hidden');
        }

        function getSavedModelItems() {
            const cfg = state.config;
            const items = [];
            (cfg.deepseekModels || []).forEach(m => items.push({ provider: 'deepseek', model: m }));
            (cfg.glmModels || []).forEach(m => items.push({ provider: 'glm', model: m }));
            (cfg.kimiModels || []).forEach(m => items.push({ provider: 'kimi', model: m }));
            return items;
        }

        function renderModelPopover() {
            const container = document.getElementById('model-popover-content');
            if (!container) return;
            const cfg = state.config;
            const current = cfg.model || 'deepseek-v4-flash';
            const currentProvider = cfg.provider || 'deepseek';
            let items = getSavedModelItems();
            if (items.length === 0) items = [{ provider: currentProvider, model: current }];
            container.innerHTML = items.map(it => {
                const active = it.model === current && it.provider === currentProvider;
                return `
                <button data-model="${escapeHTML(it.model)}" onclick="selectModel(this.dataset.model)" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-left transition ${active ? 'bg-indigo-50 dark:bg-indigo-950/40' : 'hover:bg-stone-100 dark:hover:bg-stone-700/60'}">
                    <span class="flex-1 min-w-0">
                        <span class="block text-base font-medium text-ink dark:text-stone-100 truncate">${escapeHTML(formatModelName(it.model))}</span>
                        <span class="block text-xs text-stone-400 dark:text-stone-500">${it.provider === 'deepseek' ? 'DeepSeek' : it.provider === 'glm' ? '智谱GLM' : 'Kimi'}</span>
                    </span>
                    ${active ? '<span class="text-indigo-600 dark:text-indigo-400 text-sm font-bold">✓</span>' : ''}
                </button>`;
            }).join('');
        }

        function selectModel(model) {
            const cfg = state.config;
            const isDs = /^deepseek/i.test(model);
            const isGlm = /^glm/i.test(model);
            const isKimi = /^(kimi|moonshot)/i.test(model);
            const target = (isDs && !isGlm && !isKimi) ? 'deepseek'
                : (isGlm && !isDs && !isKimi) ? 'glm'
                : (isKimi && !isDs && !isGlm) ? 'kimi'
                : (cfg.deepseekModels || []).includes(model) ? 'deepseek'
                : (cfg.glmModels || []).includes(model) ? 'glm'
                : (cfg.kimiModels || []).includes(model) ? 'kimi'
                : null;
            if (target === 'deepseek') {
                cfg.provider = 'deepseek';
                cfg.deepseekModel = model;
                cfg.apiUrl = cfg.deepseekApiUrl || 'https://api.deepseek.com/v1';
                cfg.apiKey = cfg.deepseekApiKey || '';
                cfg.model = model;
            } else if (target === 'glm') {
                cfg.provider = 'glm';
                cfg.glmModel = model;
                cfg.apiUrl = cfg.glmApiUrl || 'https://api.z.ai/api/paas/v4';
                cfg.apiKey = cfg.glmApiKey || '';
                cfg.model = model;
            } else if (target === 'kimi') {
                cfg.provider = 'kimi';
                cfg.kimiModel = model;
                cfg.apiUrl = cfg.kimiApiUrl || 'https://api.moonshot.cn/v1';
                cfg.apiKey = cfg.kimiApiKey || '';
                cfg.model = model;
            } else {
                cfg.model = model;
            }
            saveState();
            renderModelSelector();
            updateProviderButtons();
            closeModelPopover();
        }

        function renderSavedModels() {
            const box = document.getElementById('saved-models-box');
            const list = document.getElementById('saved-models-list');
            if (!box || !list) return;
            const items = getSavedModelItems();
            if (items.length === 0) { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            list.innerHTML = items.map(it => `
                <button onclick="removeSavedModelFromChip(this)" data-provider="${it.provider}" data-model="${escapeHTML(it.model)}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-stone-100 dark:bg-stone-700 border border-stone-200 dark:border-stone-600 text-sm transition hover:bg-stone-200 dark:hover:bg-stone-600">
                    <span class="text-xs text-gray-500 dark:text-gray-400">${it.provider === 'deepseek' ? 'DS' : it.provider === 'glm' ? 'GLM' : 'KI'}</span>
                    <span class="text-gray-900 dark:text-gray-100">${escapeHTML(formatModelName(it.model))}</span>
                    <span class="text-red-500 font-bold">×</span>
                </button>
            `).join('');
        }

        function removeSavedModelFromChip(el) {
            const provider = el.dataset.provider;
            const model = el.dataset.model;
            const key = provider === 'deepseek' ? 'deepseekModels' : provider === 'glm' ? 'glmModels' : 'kimiModels';
            state.config[key] = (state.config[key] || []).filter(m => m !== model);
            saveState();
            renderSavedModels();
        }

        document.addEventListener('click', (e) => {
            const popover = document.getElementById('matrix-popover');
            const btn = document.getElementById('book-matrix-btn');
            if(popover && !popover.classList.contains('hidden') && !popover.contains(e.target) && !btn.contains(e.target)) {
                closeMatrixPopover();
            }
            const mPopover = document.getElementById('model-popover');
            const mBtn = document.getElementById('model-selector-btn');
            if(mPopover && !mPopover.classList.contains('hidden') && !mPopover.contains(e.target) && !mBtn.contains(e.target)) {
                closeModelPopover();
            }
        });

        function renderMatrixPopover() {
            const container = document.getElementById('matrix-popover-content');
            if(!container) return;
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(!activeSession) return;

            let html = '';
            
            if(activeSession.systemPrompt) {
                const sysCard = state.systemCards.find(c => c.title === activeSession.systemPrompt.title);
                if(sysCard) html += buildPopoverItem('系统', activeSession.systemPrompt.title, 'system', sysCard.id, 'text-blue-500');
            }
            
            if(activeSession.activeCharacters && activeSession.activeCharacters.length > 0) {
                activeSession.activeCharacters.forEach(id => {
                    const c = state.characterCards.find(x => x.id === id);
                    if(c) html += buildPopoverItem('角色', c.title, 'character', id, 'text-purple-500');
                });
            }

            if(activeSession.activePlots && activeSession.activePlots.length > 0) {
                activeSession.activePlots.forEach(id => {
                    const p = state.plotCards.find(x => x.id === id);
                    if(p) html += buildPopoverItem('剧情', p.title, 'plot', id, 'text-green-500');
                });
            }

            if(html === '') {
                html = `<div class="py-6 text-center text-sm text-gray-400 dark:text-gray-500 italic">尚未锚定任何实体参数</div>`;
            }

            container.innerHTML = html;
        }

        function buildPopoverItem(label, title, type, id, colorClass) {
            return `
                <div class="flex items-center justify-between p-2.5 bg-white/50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700/80 border border-transparent hover:border-gray-200/60 dark:hover:border-gray-600/50 rounded-xl transition-all group cursor-default">
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-[10px] font-bold tracking-wider ${colorClass} opacity-80 mb-0.5">${label}</span>
                        <span class="text-sm text-gray-800 dark:text-gray-200 truncate font-medium">${escapeHTML(title)}</span>
                    </div>
                    <button onclick="removeMatrixItem('${type}', '${id}', event)" class="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition shrink-0 shadow-sm md:shadow-none bg-white dark:bg-gray-800 md:bg-transparent md:dark:bg-transparent">
                        <i class="fa-solid fa-minus text-sm"></i>
                    </button>
                </div>
            `;
        }

        function removeMatrixItem(type, id, event) {
            if(event) event.stopPropagation();
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(!activeSession) return;

            if(type === 'system') {
                delete activeSession.systemPrompt;
            } else if (type === 'character') {
                activeSession.activeCharacters = activeSession.activeCharacters.filter(cId => cId !== id);
            } else if (type === 'plot') {
                activeSession.activePlots = activeSession.activePlots.filter(pId => pId !== id);
            }

            saveState();
            renderMatrixPopover();
            updateBanner(activeSession);
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (sidebarOpen) {
                sidebar.classList.remove('-translate-x-full', 'pointer-events-none');
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full', 'pointer-events-none');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            }
        }

        function toggleDarkMode() { 
            state.config.darkMode = !state.config.darkMode; 
            applyDarkMode(); 
            saveState(); 
        }
        
        function applyDarkMode() { document.documentElement.classList.toggle('dark', state.config.darkMode); }

        function toggleThinkingModeViaBtn() {
            state.config.thinkingMode = !state.config.thinkingMode;
            const toggleElement = document.getElementById('thinking-mode-toggle');
            if (toggleElement) toggleElement.checked = state.config.thinkingMode;
            saveState();
            updateThinkingBulbUI();

        function saveSettings() {
            state.config.apiUrl = document.getElementById('api-url').value.trim();
            state.config.apiKey = document.getElementById('api-key').value.trim();
            state.config.model = document.getElementById('api-model').value.trim();
            const prov = state.config.provider || 'deepseek';
            if (prov === 'deepseek') {
                state.config.deepseekApiUrl = state.config.apiUrl;
                state.config.deepseekApiKey = state.config.apiKey;
            } else if (prov === 'glm') {
                state.config.glmApiUrl = state.config.apiUrl;
                state.config.glmApiKey = state.config.apiKey;
            } else {
                state.config.kimiApiUrl = state.config.apiUrl;
                state.config.kimiApiKey = state.config.apiKey;
            }
            const addFav = (key, m) => {
                const arr = state.config[key] || [];
                if (!arr.includes(m)) arr.push(m);
                if (arr.length > 10) arr.splice(0, arr.length - 10);
                state.config[key] = arr;
            };
            const isDs = /^deepseek/i.test(state.config.model);
            const isGlm = /^glm/i.test(state.config.model);
            const isKimi = /^(kimi|moonshot)/i.test(state.config.model);
            if (isDs && !isGlm && !isKimi) {
                state.config.deepseekModel = state.config.model;
                addFav('deepseekModels', state.config.model);
            } else if (isGlm && !isDs && !isKimi) {
                state.config.glmModel = state.config.model;
                addFav('glmModels', state.config.model);
            } else if (isKimi && !isDs && !isGlm) {
                state.config.kimiModel = state.config.model;
                addFav('kimiModels', state.config.model);
            } else {
                if (prov === 'deepseek') { state.config.deepseekModel = state.config.model; addFav('deepseekModels', state.config.model); }
                else if (prov === 'glm') { state.config.glmModel = state.config.model; addFav('glmModels', state.config.model); }
                else { state.config.kimiModel = state.config.model; addFav('kimiModels', state.config.model); }
            }
            state.config.temperature = parseFloat(document.getElementById('api-temperature').value);
            state.config.maxTokens = parseInt(document.getElementById('api-max-tokens').value, 10) || 8000;
            state.config.historyTurns = parseInt(document.getElementById('api-history').value, 10) || 20;
            state.config.fontSize = parseInt(document.getElementById('api-font-size').value, 10) || 16;
            state.config.uiFontSize = parseInt(document.getElementById('api-ui-font-size').value, 10) || 16;
            
            saveState(); renderModelSelector(); closeModal('settings-modal');
        }

        async function fetchModels() {
            const baseUrl = document.getElementById('api-url').value.trim().replace(/\/+$/, '');
            const apiKey = document.getElementById('api-key').value.trim();
            const statusDiv = document.getElementById('model-fetch-status');
            const modelContainer = document.getElementById('model-input-container');

            if (!apiKey) {
                statusDiv.textContent = '错误：请先填写 API Key';
                statusDiv.className = 'text-sm mt-1 text-red-500';
                statusDiv.classList.remove('hidden');
                return;
            }

            statusDiv.textContent = '正在获取模型列表...';
            statusDiv.className = 'text-sm mt-1 text-blue-500';
            statusDiv.classList.remove('hidden');

            try {
                const res = await fetch(`${baseUrl}/models`, { method: 'GET', headers: { 'Authorization': `Bearer ${apiKey}` } });
                if (!res.ok) throw new Error(`请求失败: HTTP ${res.status}`);
                const data = await res.json();
                
                if (data && data.data && Array.isArray(data.data)) {
                    const currentModel = document.getElementById('api-model').value.trim();
                    const ids = data.data.map(m => m.id);
                    let options = ids.map(id => `<option value="${id}" ${id === currentModel ? 'selected' : ''}>${id}</option>`).join('');
                    if (currentModel && !ids.includes(currentModel)) {
                        options = `<option value="${currentModel}" selected>${currentModel}</option>` + options;
                    }
                    modelContainer.innerHTML = `<select id="api-model" class="w-full p-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 focus:outline-none text-base text-ink dark:text-stone-100">${options}</select>`;
                    const provAm = state.config.provider || 'deepseek';
                    const amObj = state.config.availableModels && typeof state.config.availableModels === 'object' && !Array.isArray(state.config.availableModels)
                        ? state.config.availableModels : {};
                    amObj[provAm] = ids;
                    state.config.availableModels = amObj;
                    saveState();
                    statusDiv.textContent = `获取成功：已找到 ${ids.length} 个模型`;
                    statusDiv.className = 'text-sm mt-1 text-green-500';
                } else {
                    throw new Error('数据格式错误');
                }
            } catch (err) {
                statusDiv.textContent = `获取失败: ${err.message}`;
                statusDiv.className = 'text-sm mt-1 text-red-500';
            }
        }

        function exportMarkdown(sessionId, event) {
            if(event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const session = state.sessions.find(s => s.id === sessionId);
            if (!session) return;

            let markdown = `# ${session.title}\n\n`;
            session.messages.forEach(msg => {
                const role = msg.role === 'user' ? '**You**' : '**Way**';
                markdown += `${role}:\n${msg.content}\n\n`;
            });

            const filename = `${session.title.replace(/[\\/:*?"<>|]/g, '') || 'chat'}.md`;
            const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });

            const doFallback = () => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            if (navigator.share && navigator.canShare) {
                const file = new File([blob], filename, { type: 'text/markdown' });
                if (navigator.canShare({ files: [file] })) {
                    navigator.share({
                        title: session.title,
                        files: [file]
                    }).catch(err => {
                        console.log('分享取消或发生错误:', err);
                    });
                } else {
                    doFallback();
                }
            } else {
                doFallback();
            }
        }

        function forkSession(messageIndex) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (!activeSession) return;
            const forkedMessages = JSON.parse(JSON.stringify(activeSession.messages.slice(0, messageIndex + 1)));
            const newSession = { 
                id: Date.now().toString(), 
                title: activeSession.title + ' [分支]', 
                messages: forkedMessages,
                systemPrompt: activeSession.systemPrompt ? JSON.parse(JSON.stringify(activeSession.systemPrompt)) : null,
                activeCharacters: [...(activeSession.activeCharacters || [])],
                activePlots: [...(activeSession.activePlots || [])],
                updatedAt: Date.now()
            };
            state.sessions.unshift(newSession);
            state.activeSessionId = newSession.id;
            renderSessions(); renderChat(); saveState();
        }

        async function deleteMessage(index) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (!activeSession) return;
            if (!(await uiConfirm('确定删除此消息及其之后的所有回复吗？'))) return;
            activeSession.messages.splice(index);
            renderChat(); saveState();
        }

        function editMessage(index) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(!activeSession) return;
            const msg = activeSession.messages[index];
            
            editingMessageIndex = index;
            document.getElementById('edit-message-modal').classList.remove('hidden');
            const contentEl = document.getElementById('edit-message-content');
            contentEl.value = msg.content;
            void contentEl.offsetHeight;
        }

        function closeEditMessageModal() {
            editingMessageIndex = null;
            document.getElementById('edit-message-modal').classList.add('hidden');
        }

        function saveEditedMessage() {
            if (editingMessageIndex === null) return;
            const contentEl = document.getElementById('edit-message-content');
            const newContent = contentEl.value.trim();
            
            if (newContent !== '') {
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                const msg = activeSession.messages[editingMessageIndex];
                msg.content = newContent;
                
                const targetIndex = editingMessageIndex;
                closeEditMessageModal();
                
                activeSession.messages.splice(targetIndex + 1);
                if (msg.role === 'user') {
                    const contentToResend = activeSession.messages.pop().content;
                    renderChat(); 
                    triggerSend(contentToResend);
                    return;
                }
                
                renderChat(); 
                saveState();
            } else {
                closeEditMessageModal();
            }
        }

        function copyMessage(index) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (!activeSession || !activeSession.messages[index]) return;
            const text = activeSession.messages[index].content;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('该段对话已成功复制到剪贴板。');
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed'; 
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('该段对话已成功复制到剪贴板。');
                } catch (e) {
                    console.error('复制流执行中断:', e);
                }
                document.body.removeChild(textarea);
            });
        }

        function createChatFromPlot(plotId, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            
            const plot = state.plotCards.find(p => p.id === plotId);
            if (!plot) return;

            const isDraftMode = (matrixMode === 'draft');
            closeModal('world-matrix-modal');
            if (abortController) stopGeneration();

            let sourceSystemPrompt, sourceCharacters, sourcePlots;

            if (isDraftMode) {
                sourceSystemPrompt = draftSystemPrompt ? JSON.parse(JSON.stringify(draftSystemPrompt)) : null;
                sourceCharacters = [...draftCharacters];
                sourcePlots = [...draftPlots];
            } else {
                const currentSession = state.sessions.find(s => s.id === state.activeSessionId);
                sourceSystemPrompt = currentSession && currentSession.systemPrompt ? JSON.parse(JSON.stringify(currentSession.systemPrompt)) : null;
                sourceCharacters = currentSession ? [...currentSession.activeCharacters] : [];
                sourcePlots = currentSession ? [...currentSession.activePlots] : [];
            }

            if (!sourcePlots.includes(plotId)) {
                sourcePlots.push(plotId);
            }

            const newSession = { 
                id: Date.now().toString(), 
                title: '正在载入剧情...', 
                messages: [],
                systemPrompt: sourceSystemPrompt,
                activeCharacters: sourceCharacters,
                activePlots: sourcePlots,
                updatedAt: Date.now()
            };
            
            state.sessions.unshift(newSession);
            state.activeSessionId = newSession.id;
            
            saveState();
            renderSessions();
            renderChat(); 
            
            setTimeout(() => {
                triggerSend(plot.content);
            }, 50);
        }

                <label class="relative flex items-center cursor-pointer group w-full">
                    <input type="checkbox" class="sr-only card-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleMatrixItem('plot', '${p.id}', this.checked)">
                    <div class="w-full p-3.5 bg-gray-50/60 dark:bg-gray-800/40 rounded-2xl flex justify-between items-center gap-3 transition-all border ${isChecked ? 'border-green-500/80 bg-green-50/20 dark:bg-green-950/10' : 'border-gray-200/40 dark:border-gray-800/40'}">
                        <div class="flex-1 truncate">
                            <div class="font-bold text-base ${isChecked ? 'text-green-600 dark:text-green-400' : 'text-gray-800 dark:text-gray-200'} truncate">${escapeHTML(p.title)}</div>
                        </div>
                        <div class="flex items-center gap-3 shrink-0 z-10">
                            <button type="button" onclick="createChatFromPlot('${p.id}', event)" class="text-gray-400 hover:text-indigo-500 transition-colors p-1.5" title="以此剧情创建新对话"><i class="fa-solid fa-paper-plane text-base"></i></button>
                            <button type="button" onclick="openEditPromptModal('plot', '${p.id}', event)" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 transition-colors p-1.5" title="编辑"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                            <button type="button" onclick="deleteCard('plot', '${p.id}'); event.preventDefault();" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 transition-colors p-1.5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                        </div>
                    </div>
                </label>`;
            }).join('');
        }

        function toggleSystem(id) {
            const p = state.systemCards.find(x => x.id === id);
            if (!p) return;
            if (matrixMode === 'draft') {
                if(draftSystemPrompt?.title === p.title) {
                    draftSystemPrompt = null;
                } else {
                    draftSystemPrompt = { title: p.title, content: p.content };
                }
                saveState();
                renderWorldMatrix();
            } else {
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                if (!activeSession) return;
                if(activeSession.systemPrompt?.title === p.title) {
                    delete activeSession.systemPrompt; 
                } else {
                    activeSession.systemPrompt = { title: p.title, content: p.content };
                }
                saveState();
                renderWorldMatrix();
                updateBanner(activeSession);
                renderMatrixPopover();
            }
        }

        function toggleMatrixItem(type, id, isChecked) {
            if (matrixMode === 'draft') {
                const targetArray = type === 'character' ? draftCharacters : draftPlots;
                if (isChecked) {
                    if(!targetArray.includes(id)) targetArray.push(id);
                } else {
                    const idx = targetArray.indexOf(id);
                    if(idx > -1) targetArray.splice(idx, 1);
                }
                saveState();
                renderWorldMatrix();
            } else {
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                if (!activeSession) return;
                const targetArray = type === 'character' ? activeSession.activeCharacters : activeSession.activePlots;
                if (isChecked) {
                    if(!targetArray.includes(id)) targetArray.push(id);
                } else {
                    const idx = targetArray.indexOf(id);
                    if(idx > -1) targetArray.splice(idx, 1);
                }
                saveState();
                renderWorldMatrix();
                updateBanner(activeSession);
                renderMatrixPopover();
            }
        }

        function addCard(type) {
            const prefix = type === 'system' ? 'sys' : type === 'character' ? 'char' : 'plot';
            const titleEl = document.getElementById(`new-${prefix}-title`);
            const contentEl = document.getElementById(`new-${prefix}-content`);
            const title = titleEl.value.trim();
            const content = contentEl.value.trim();
            if (!title || !content) return;
            
            const newObj = { id: Date.now().toString() + prefix[0], title, content };
            if (type === 'system') state.systemCards.push(newObj);
            else if (type === 'character') state.characterCards.push(newObj);
            else state.plotCards.push(newObj);
            
            titleEl.value = ''; contentEl.value = '';
            contentEl.style.height = 'auto'; 
            saveState(); renderWorldMatrix();
        }

        async function deleteCard(type, id) {
            if(!(await uiConfirm('确定删除此设定吗？'))) return;
            if (type === 'system') {
                state.systemCards = state.systemCards.filter(x => x.id !== id);
                state.sessions.forEach(s => {
                    if(s.systemPrompt && !state.systemCards.find(c => c.title === s.systemPrompt.title)) delete s.systemPrompt;
                });
                if (draftSystemPrompt && !state.systemCards.find(c => c.title === draftSystemPrompt.title)) draftSystemPrompt = null;
            } else if (type === 'character') {
                state.characterCards = state.characterCards.filter(x => x.id !== id);
                state.sessions.forEach(s => s.activeCharacters = s.activeCharacters.filter(cId => cId !== id));
                draftCharacters = draftCharacters.filter(cId => cId !== id);
            } else {
                state.plotCards = state.plotCards.filter(x => x.id !== id);
                state.sessions.forEach(s => s.activePlots = s.activePlots.filter(pId => pId !== id));
                draftPlots = draftPlots.filter(pId => pId !== id);
            }
            saveState(); 
            renderWorldMatrix(); 
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(activeSession) updateBanner(activeSession);
            renderMatrixPopover();
        }

        function openEditPromptModal(type, id, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            editingPromptId = { type, id };
            let p;
            if (type === 'system') p = state.systemCards.find(x => x.id === id);
            else if (type === 'character') p = state.characterCards.find(x => x.id === id);
            else p = state.plotCards.find(x => x.id === id);
            
            if (p) {
                document.getElementById('edit-prompt-modal').classList.remove('hidden');
                document.getElementById('edit-prompt-title').value = p.title;
                const contentEl = document.getElementById('edit-prompt-content');
                contentEl.value = p.content;
                void contentEl.offsetHeight;
            }
        }

        function closeEditPromptModal() {
            editingPromptId = null;
            document.getElementById('edit-prompt-modal').classList.add('hidden');
        }

        function saveEditedPrompt() {
            if (!editingPromptId) return;
            const title = document.getElementById('edit-prompt-title').value.trim();
            const content = document.getElementById('edit-prompt-content').value.trim();
            if (!title || !content) return;
            
            const { type, id } = editingPromptId;
            let targetArray;
            if (type === 'system') targetArray = state.systemCards;
            else if (type === 'character') targetArray = state.characterCards;
            else targetArray = state.plotCards;

            const idx = targetArray.findIndex(p => p.id === id);
            if (idx !== -1) {
                targetArray[idx].title = title;
                targetArray[idx].content = content;
                
                if (type === 'system') {
                    const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                    if (activeSession && activeSession.systemPrompt && activeSession.systemPrompt.title === targetArray[idx].title) {
                        activeSession.systemPrompt.content = content;
                    }
                    if (draftSystemPrompt && draftSystemPrompt.title === targetArray[idx].title) {
                        draftSystemPrompt.content = content;
                    }
                }
                
                saveState();
                renderWorldMatrix();
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                if(activeSession) updateBanner(activeSession);
                renderMatrixPopover();
                closeEditPromptModal();
            }
        }

        function renderSessions() {
            const container = document.getElementById('sessions-list');
            if(!container) return;
            const sorted = state.sessions.filter(s => s.messages && s.messages.length > 0)
                .sort((a, b) => (b.updatedAt || parseInt(b.id)) - (a.updatedAt || parseInt(a.id)));
            container.innerHTML = sorted.map((s, i) => {
                const hasMatrix = s.systemPrompt || (s.activeCharacters && s.activeCharacters.length > 0) || (s.activePlots && s.activePlots.length > 0);
                const recentLabel = i === 0 ? '<div class="text-xs text-gray-400 dark:text-gray-500 mb-1 px-1 tracking-wider">最近</div>' : '';
                return recentLabel + `
                <div class="flex justify-between items-center p-3 md:p-2.5 rounded-xl cursor-pointer mb-1 select-none ${s.id === state.activeSessionId ? 'bg-gray-200 dark:bg-gray-700' : 'hover:bg-gray-200/60 dark:hover:bg-gray-700'}" 
                     style="-webkit-touch-callout: none;"
                     ontouchstart="startSessionPress(event, '${s.id}')"
                     ontouchmove="cancelSessionPress(event)"
                     ontouchend="endSessionPress(event)"
                     ontouchcancel="cancelSessionPress(event)"
                     onmousedown="startSessionPress(event, '${s.id}')"
                     onmousemove="cancelSessionPress(event)"
                     onmouseup="endSessionPress(event)"
                     onmouseleave="cancelSessionPress(event)"
                     oncontextmenu="event.preventDefault();"
                     onclick="handleSessionClick(event, '${s.id}')">
                    <div class="truncate flex-1 text-lg text-gray-900 dark:text-gray-100 ${hasMatrix ? 'font-medium' : ''}">
                        ${escapeHTML(s.title)}
                    </div>
                </div>`;
            }).join('');
        }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function buildMessageHTML(content, reasoning) {
            let html = '';
            if (reasoning) {
                html += `
                    <details class="mb-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800/80 overflow-hidden w-fit max-w-full z-10 relative">
                        <summary class="cursor-pointer p-3 text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition flex items-center gap-2">
                            <i class="fa-solid fa-brain text-blue-500"></i> 思考过程
                        </summary>
                        <div class="p-4 pt-2 text-[0.9em] text-gray-500 dark:text-gray-400 whitespace-pre-wrap border-t border-gray-200 dark:border-gray-700 leading-relaxed">${escapeHTML(reasoning)}</div>
                    </details>
                `;
            }
            if (content && typeof marked !== 'undefined') {
                const parsed = marked.parse(content);
                html += (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(parsed) : parsed;
            } else if (content) {
                html += `<div class="whitespace-pre-wrap">${escapeHTML(content)}</div>`;
            }
            return html;
        }

        function updateBanner(session) {
            const bookBtn = document.getElementById('book-matrix-btn');

            let hasAny = false;
            if (session.systemPrompt) hasAny = true;
            if (session.activeCharacters && session.activeCharacters.length > 0) hasAny = true;
            if (session.activePlots && session.activePlots.length > 0) hasAny = true;
            
            if (hasAny) {
                bookBtn.className = "pointer-events-auto w-11 h-11 flex items-center justify-center hover:bg-white dark:hover:bg-gray-700 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-md transition-colors shadow-sm border border-blue-500/30 dark:border-blue-400/30 mt-0.5 text-blue-500 dark:text-blue-400 font-bold";
            } else {
                bookBtn.className = "pointer-events-auto w-11 h-11 flex items-center justify-center hover:bg-white dark:hover:bg-stone-700 rounded-full bg-white/85 dark:bg-stone-800/85 backdrop-blur-md transition-colors shadow-bubble border border-stone-200/60 dark:border-stone-700/60 mt-0.5 text-ink dark:text-stone-100";
            }
        }

                            <div class="flex gap-5 md:gap-4 text-stone-400 md:text-stone-500 mt-1 ml-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity pointer-events-none ${isGenerating ? 'hidden' : ''}">
                                <button onclick="copyMessage(${index})" class="hover:text-indigo-500 p-1 -m-1 pointer-events-auto" title="复制文本"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                                <button onclick="editMessage(${index})" class="hover:text-blue-500 p-1 -m-1 pointer-events-auto" title="修改"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                                <button onclick="forkSession(${index})" class="hover:text-green-500 p-1 -m-1 pointer-events-auto" title="从此分支"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></button>
