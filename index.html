<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-white dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WayChat</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .message-content pre { padding: 1rem; border-radius: 0.5rem; background-color: #1e293b; color: #e2e8f0; overflow-x: auto; }
        .message-content code { font-family: monospace; }
        .typing-indicator::after { content: '▋'; animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        input[type=range] { accent-color: #4f46e5; }
        
        .card-checkbox:checked + div { border-color: #4f46e5; background-color: rgba(79, 70, 229, 0.08); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }
        .dark .card-checkbox:checked + div { border-color: #6366f1; background-color: rgba(99, 102, 241, 0.15); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
        .prose p:first-child { margin-top: 0; }
        .prose p:last-child { margin-bottom: 0; }

        input:focus, textarea:focus, select:focus, button:focus, div:focus, label:focus {
            outline: none !important;
            box-shadow: none !important;
            border-color: inherit-default !important;
        }
    </style>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen w-full flex transition-colors duration-200 text-lg">

    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity opacity-0" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-80 bg-gray-100 dark:bg-gray-800 flex flex-col border-r border-gray-300 dark:border-gray-700 h-full shrink-0 transform -translate-x-full transition-transform duration-300 md:translate-x-0 shadow-2xl md:shadow-none" style="z-index: 60;">
        <div class="p-4 flex justify-between items-center border-b border-gray-300 dark:border-gray-700 pt-[calc(1rem+env(safe-area-inset-top))]">
            <h1 class="text-2xl font-bold tracking-tight flex items-baseline gap-1.5">WayChat<span class="text-xs font-normal text-gray-400 dark:text-gray-500">v4.1</span></h1>
            <button onclick="toggleDarkMode()" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors text-gray-700 dark:text-gray-300">
                <svg class="dark:hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg class="hidden dark:inline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-2 text-lg" id="sessions-list"></div>

        <div class="p-2 border-t border-gray-300 dark:border-gray-700 space-y-2 shrink-0 bg-gray-100 dark:bg-gray-800 pb-[calc(0.5rem+env(safe-area-inset-bottom))]">
            <button onclick="createNewSession(); if(window.innerWidth < 768) toggleSidebar();" class="w-full text-left p-2.5 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 transition font-bold text-lg text-gray-900 dark:text-gray-100 flex items-center">
                <svg class="mr-2.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>新建对话
            </button>
            <button onclick="matrixMode='draft'; openModal('world-matrix-modal'); if(window.innerWidth < 768) toggleSidebar();" class="w-full text-left p-2.5 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 transition text-lg text-gray-900 dark:text-gray-100 flex items-center">
                <svg class="mr-2.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>设定与角色库
            </button>
            <button onclick="openModal('settings-modal'); if(window.innerWidth < 768) toggleSidebar();" class="w-full text-left p-2.5 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 transition text-lg text-gray-900 dark:text-gray-100 flex items-center">
                <svg class="mr-2.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>设置
            </button>
        </div>
    </aside>

    <main class="flex-1 min-h-screen relative flex flex-col min-w-0 md:ml-80">
        
        <header class="fixed top-0 left-0 right-0 md:left-80 flex justify-between items-start px-4 md:px-6 z-40 pt-[calc(0.5rem+env(safe-area-inset-top))] pb-3 pointer-events-none bg-gradient-to-b from-white via-white/90 to-transparent dark:from-gray-900 dark:via-gray-900/90 dark:to-transparent">
            <div class="flex items-start gap-2.5">
                <button onclick="toggleSidebar()" class="pointer-events-auto w-11 h-11 flex items-center justify-center hover:bg-white dark:hover:bg-gray-700 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-md text-gray-700 dark:text-gray-200 transition-colors shadow-sm border border-gray-200/50 dark:border-gray-700/50 mt-0.5">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
            
            <div class="absolute left-1/2 -translate-x-1/2 top-[calc(0.5rem+env(safe-area-inset-top))] pointer-events-auto">
                <button onclick="toggleModelPopover(event)" id="model-selector-btn" class="h-11 px-3 flex items-center gap-1.5 rounded-full hover:bg-white/80 dark:hover:bg-gray-800/80 transition-colors text-gray-900 dark:text-gray-100">
                    <span id="model-selector-label" class="text-base font-bold whitespace-nowrap">Deepseek v4 flash</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
            </div>

            <div class="flex items-center gap-2 relative pointer-events-auto">
                <button onclick="toggleMatrixPopover(event)" id="book-matrix-btn" class="w-11 h-11 flex items-center justify-center hover:bg-white dark:hover:bg-gray-700 rounded-full bg-white/80 dark:bg-gray-800/80 backdrop-blur-md transition-colors shadow-sm border border-gray-200/50 dark:border-gray-700/50 mt-0.5 text-gray-900 dark:text-gray-100" title="设定控制台">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
                </button>
            </div>
        </header>

        <div id="matrix-popover" class="hidden fixed top-[calc(4rem+env(safe-area-inset-top))] right-4 md:right-6 w-64 bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl shadow-2xl border border-gray-200/50 dark:border-gray-700/50 rounded-2xl z-50 flex flex-col overflow-hidden transition-all origin-top-right">
            <div class="px-4 py-2.5 border-b border-gray-100 dark:border-gray-700/50 bg-gray-50/50 dark:bg-gray-900/50 flex justify-between items-center shrink-0">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">当前环境注入</span>
            </div>
            <div id="matrix-popover-content" class="max-h-60 overflow-y-auto p-2 space-y-1 no-scrollbar">
                </div>
            <div class="p-2 border-t border-gray-100 dark:border-gray-700/50 bg-gray-50/50 dark:bg-gray-900/50 shrink-0">
                <button onclick="closeMatrixPopover(); openModal('world-matrix-modal')" class="w-full py-2.5 rounded-xl bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 transition flex items-center justify-center gap-2 text-gray-800 dark:text-gray-200 font-bold text-sm shadow-sm">
                    <i class="fa-solid fa-plus"></i> 管理完整库
                </button>
            </div>
        </div>

        <div id="model-popover" class="hidden fixed top-[calc(4rem+env(safe-area-inset-top))] left-1/2 -translate-x-1/2 w-60 bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl shadow-2xl border border-gray-200/50 dark:border-gray-700/50 rounded-2xl z-50 flex flex-col overflow-hidden transition-all">
            <div class="px-4 py-2.5 border-b border-gray-100 dark:border-gray-700/50 bg-gray-50/50 dark:bg-gray-900/50 shrink-0">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">切换模型</span>
            </div>
            <div id="model-popover-content" class="max-h-60 overflow-y-auto p-2 space-y-1 no-scrollbar">
            </div>
        </div>

        <div id="matrix-banner" class="hidden"></div>

        <div id="chat-container" class="w-full max-w-none px-4 md:px-8 lg:px-20 mx-auto space-y-7 z-10 text-lg md:text-xl" style="padding-top: calc(5.5rem + env(safe-area-inset-top)); padding-bottom: calc(8.5rem + env(safe-area-inset-bottom));"></div>

        <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 md:left-80 px-4 pb-6 pt-16 bg-gradient-to-t from-white via-white/95 to-transparent dark:from-gray-900 dark:via-gray-900/95 z-30 pointer-events-none transition-all duration-300" style="padding-bottom: calc(1rem + env(safe-area-inset-bottom));">
            
            <div class="max-w-4xl mx-auto relative flex justify-end mb-3 px-2">
                <button id="scroll-to-bottom-btn" onclick="forceScrollToBottom()" class="w-10 h-10 bg-white/95 dark:bg-gray-800/95 rounded-full shadow-md border border-gray-200/50 dark:border-gray-700/50 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 transition-all duration-300 pointer-events-auto opacity-0 scale-90 translate-y-2 pointer-events-none z-50 backdrop-blur-md">
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
            </div>

            <div class="max-w-4xl mx-auto flex items-end gap-2.5 relative pointer-events-auto">
                
                <button onclick="toggleThinkingModeViaBtn()" id="thinking-bulb-btn" class="w-11 h-11 flex items-center justify-center rounded-full bg-white/90 dark:bg-gray-800/90 border border-gray-300/50 dark:border-gray-700/50 shadow-lg backdrop-blur-xl shrink-0 text-gray-700 dark:text-gray-300 transition-all mb-[11px]">
                    <i class="fa-regular fa-lightbulb text-xl"></i>
                </button>
                <input type="checkbox" id="thinking-mode-toggle" class="sr-only">
                
                <div class="flex-1 flex items-end gap-2 relative bg-white/90 dark:bg-gray-800/90 border border-gray-300/50 dark:border-gray-700/50 rounded-[24px] p-2 text-base shadow-2xl backdrop-blur-xl transition-all">
                    <textarea id="message-input" rows="1" class="flex-1 resize-none bg-transparent pl-4 pr-1 py-2.5 text-base md:text-lg focus:outline-none text-gray-900 dark:text-gray-100 min-h-[40px] max-h-[160px] align-bottom border-0" placeholder="输入消息..." onkeydown="handleInputKeydown(event)" oninput="autoResize(this)" onfocus="document.getElementById('bottom-bar').style.paddingBottom = '8px'" onblur="document.getElementById('bottom-bar').style.paddingBottom = 'calc(1rem + env(safe-area-inset-bottom))'"></textarea>
                    
                    <button onclick="sendMessage()" id="send-btn" class="bg-blue-600 text-white p-3 rounded-full hover:bg-blue-700 transition w-11 h-11 flex items-center justify-center shrink-0 shadow-md">
                        <i class="fa-solid fa-arrow-up text-base font-bold"></i>
                    </button>
                    <button onmousedown="stopGeneration(); event.preventDefault();" ontouchstart="stopGeneration(); event.preventDefault();" id="stop-btn" class="hidden bg-gray-900 dark:bg-white text-white dark:text-gray-900 p-3 rounded-full hover:bg-black dark:hover:bg-gray-100 transition w-11 h-11 flex items-center justify-center shrink-0 shadow-md">
                        <i class="fa-solid fa-stop text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center md:p-4" style="z-index: 70;">
        <div class="bg-white/95 dark:bg-gray-900/95 border-0 md:border border-gray-200/50 dark:border-gray-800/60 w-full h-full md:h-[85vh] md:max-w-3xl rounded-none md:rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col backdrop-blur-xl pb-[calc(1.5rem+env(safe-area-inset-bottom))] pt-[calc(1rem+env(safe-area-inset-top))]">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-xl md:text-2xl font-bold tracking-tight">设置</h2>
                <button onclick="closeModal('settings-modal')" class="text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 p-2 transition-colors"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="space-y-4 overflow-y-auto pr-2 flex-1 text-base">
                <div>
                    <label class="block text-base font-medium mb-1.5">API Base URL</label>
                    <input type="text" id="api-url" class="w-full p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 border border-gray-300/60 dark:border-gray-600 focus:outline-none text-base" value="https://api.deepseek.com/v1">
                </div>
                <div>
                    <label class="block text-base font-medium mb-1.5">API Key</label>
                    <input type="password" id="api-key" class="w-full p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 border border-gray-300/60 dark:border-gray-600 focus:outline-none text-base" placeholder="sk-...">
                </div>
                <div>
                    <label class="block text-base font-medium mb-1.5">选择模型 (Model)</label>
                    <div class="flex gap-2 relative">
                        <div id="model-input-container" class="flex-1">
                            <input type="text" id="api-model" class="w-full p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 border border-gray-300/60 dark:border-gray-600 focus:outline-none text-base" value="deepseek-v4-flash">
                        </div>
                        <button onclick="fetchModels()" class="bg-indigo-600 text-white px-3.5 rounded-xl hover:bg-indigo-700 transition" title="获取模型列表">
                            <i class="fa-solid fa-satellite-dish"></i>
                        </button>
                    </div>
                    <div id="model-fetch-status" class="text-sm mt-1 hidden"></div>
                </div>

                <div class="border-t border-gray-200 dark:border-gray-700 pt-4 mt-2 space-y-4">
                    <div>
                        <label class="block text-base mb-1.5 flex justify-between">
                            <span class="font-bold text-blue-600 dark:text-blue-400">聊天内容字体</span>
                            <span id="font-display" class="font-mono text-blue-500 font-bold">16px</span>
                        </label>
                        <input type="range" id="api-font-size" min="12" max="24" step="1" value="16" class="w-full cursor-pointer" oninput="document.getElementById('font-display').innerText = this.value + 'px'; state.config.fontSize = parseInt(this.value); renderChat();">
                    </div>
                    <div>
                        <label class="block text-base mb-1.5 flex justify-between">
                            <span class="font-bold text-teal-600 dark:text-teal-400">系统界面字体</span>
                            <span id="ui-font-display" class="font-mono text-teal-500 font-bold">16px</span>
                        </label>
                        <input type="range" id="api-ui-font-size" min="12" max="20" step="1" value="16" class="w-full cursor-pointer" oninput="document.getElementById('ui-font-display').innerText = this.value + 'px'; state.config.uiFontSize = parseInt(this.value); applyUiFontSize();">
                    </div>
                    <div>
                        <label class="block text-base font-medium mb-1.5 flex justify-between">
                            <span>携带历史对话轮次</span>
                            <span id="history-display" class="font-mono text-indigo-500">20</span>
                        </label>
                        <input type="range" id="api-history" min="1" max="100" step="1" value="20" class="w-full cursor-pointer" oninput="document.getElementById('history-display').innerText = this.value">
                    </div>
                    <div>
                        <label class="block text-base font-medium mb-1.5 flex justify-between">
                            <span>Temperature (发散度)</span>
                            <span id="temp-display" class="font-mono text-indigo-500">1.0</span>
                        </label>
                        <input type="range" id="api-temperature" min="0" max="2" step="0.1" value="1.0" class="w-full cursor-pointer" oninput="document.getElementById('temp-display').innerText = parseFloat(this.value).toFixed(1)">
                    </div>
                    <div>
                        <label class="block text-base font-medium mb-1.5">Max Tokens (最大长度)</label>
                        <input type="number" id="api-max-tokens" class="w-full p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 border border-gray-300/60 dark:border-gray-600 focus:outline-none text-base" value="8000" min="1" max="32768" step="1">
                    </div>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-2 shrink-0">
                <button onclick="closeModal('settings-modal')" class="px-5 py-2.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition text-base">取消</button>
                <button onclick="saveSettings()" class="px-6 py-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition text-base font-bold">保存</button>
            </div>
        </div>
    </div>

    <div id="world-matrix-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center md:p-4" style="z-index: 70;">
        <div class="bg-white/95 dark:bg-gray-900/95 border-0 md:border border-gray-200/50 dark:border-gray-800/60 w-full h-full md:h-[85vh] md:max-w-3xl rounded-none md:rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col backdrop-blur-xl pb-[calc(1.5rem+env(safe-area-inset-bottom))] pt-[calc(1rem+env(safe-area-inset-top))]">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-xl md:text-2xl font-bold tracking-tight">设定与角色库</h2>
                <button onclick="closeModal('world-matrix-modal')" class="text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 p-2 transition-colors"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            
            <div class="flex overflow-x-auto whitespace-nowrap border-b border-gray-200 dark:border-gray-800 mb-4 shrink-0 no-scrollbar">
                <button class="tab-btn px-4 py-2.5 text-base font-bold text-blue-600 border-b-2 border-blue-600 transition-all" onclick="switchTab('system', this)">文风设定</button>
                <button class="tab-btn px-4 py-2.5 text-base font-medium text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 border-b-2 border-transparent transition-all" onclick="switchTab('characters', this)">角色卡</button>
                <button class="tab-btn px-4 py-2.5 text-base font-medium text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 border-b-2 border-transparent transition-all" onclick="switchTab('plots', this)">剧情卡</button>
            </div>

            <div id="tab-system" class="matrix-tab flex-1 flex flex-col overflow-hidden text-base">
                <div class="pb-4 mb-2 space-y-3 shrink-0 flex flex-col border-b border-gray-100 dark:border-gray-800/50">
                    <input type="text" id="new-sys-title" placeholder="名称" class="w-full px-4 py-3 rounded-full bg-gray-100/70 dark:bg-gray-800/60 border border-gray-200/40 dark:border-gray-700/40 focus:outline-none text-base font-medium">

        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 dark:border-gray-800 shrink-0">

    <div id="edit-message-modal" class="hidden fixed inset-0 bg-white dark:bg-gray-900 z-[80] flex flex-col" style="padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)">
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 dark:border-gray-800 shrink-0">
            <h2 class="text-xl font-bold tracking-tight text-gray-900 dark:text-gray-100">修改消息内容</h2>
            <button onclick="closeEditMessageModal()" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors text-xl leading-none">&times;</button>
        </div>

            <textarea id="edit-message-content" rows="4" class="flex-1 w-full px-4 py-3 rounded-2xl bg-gray-100/70 dark:bg-gray-800/60 border border-gray-200/40 dark:border-gray-700/40 focus:outline-none text-base resize-none overflow-y-auto text-gray-900 dark:text-gray-100"></textarea>

    <div id="session-action-menu" class="hidden fixed z-[100] bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl border border-gray-200/50 dark:border-gray-700/50 rounded-2xl shadow-xl flex flex-col overflow-hidden w-36 origin-top-left transition-all duration-200 scale-95 opacity-0">
        <button onclick="renameActiveActionSession()" class="w-full px-5 py-3.5 text-left text-base font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-800/60">重命名</button>
        <button onclick="downloadActiveActionSession()" class="w-full px-5 py-3.5 text-left text-base font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-800/60">下载</button>
        <button onclick="deleteActiveActionSession()" class="w-full px-5 py-3.5 text-left text-base font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition">删除</button>
    </div>

    <script>
        let state = {
            config: { 
                apiUrl: 'https://api.deepseek.com/v1', 
                apiKey: '', 
                model: 'deepseek-v4-flash', 
                darkMode: false, 
                thinkingMode: false,
                temperature: 1.0,
                maxTokens: 8000, 
                historyTurns: 20,
                fontSize: 16,
                uiFontSize: 16
            },
            sessions: [],
            activeSessionId: null,
            systemCards: [
                { id: Date.now().toString() + 's', title: '默认助手', content: '你是一个乐于助人的智能助手。' }
            ],
            characterCards: [],
            plotCards: []
        };

        let abortController = null;
        let editingPromptId = null;
        let editingMessageIndex = null; 
        let sidebarOpen = false;

        let draftSystemPrompt = null;
        let draftCharacters = [];
        let draftPlots = [];
        let matrixMode = 'session';

        function getMatrixContext() {
            if (matrixMode === 'draft') {
                return {
                    systemPrompt: draftSystemPrompt,
                    activeCharacters: draftCharacters,
                    activePlots: draftPlots
                };
            }
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            return activeSession || null;
        }

        function init() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            
            try {
                const savedState = localStorage.getItem('deepseek_client_state_v28');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    state = { ...state, ...parsed };
                    state.config = { ...{apiUrl: 'https://api.deepseek.com/v1', apiKey: '', model: 'deepseek-v4-flash', darkMode: false, thinkingMode: false, temperature: 1.0, maxTokens: 8000, historyTurns: 20, fontSize: 16, uiFontSize: 16}, ...parsed.config };
                    if(parsed.prompts && !parsed.systemCards) state.systemCards = parsed.prompts;
                    if(!state.characterCards) state.characterCards = [];
                    if(!state.plotCards) state.plotCards = [];
                    if(parsed.draftSystemPrompt !== undefined) draftSystemPrompt = parsed.draftSystemPrompt;
                    if(parsed.draftCharacters) draftCharacters = parsed.draftCharacters;
                    if(parsed.draftPlots) draftPlots = parsed.draftPlots;
                } else {
                    const fallbacks = ['deepseek_client_state_v26', 'deepseek_client_state_v22', 'deepseek_client_state_v18'];
                    for (const fb of fallbacks) {
                        const d = localStorage.getItem(fb);
                        if(d) { state = JSON.parse(d); break; }
                    }
                }
                
                if (window.matchMedia) {
                    state.config.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                saveState();
            } catch (e) {
                console.error("State parse error", e);
            }

            state.sessions = state.sessions.filter(s => s.messages && s.messages.length > 0);
            createNewSession(false);
            
            state.sessions.forEach(s => {
                if(!s.activeCharacters) s.activeCharacters = [];
                if(!s.activePlots) s.activePlots = [];
                if(!s.updatedAt) s.updatedAt = parseInt(s.id) || Date.now();
            });

            const toggleElement = document.getElementById('thinking-mode-toggle');
            if (toggleElement) toggleElement.checked = !!state.config.thinkingMode;
            
            applyDarkMode(); 
            applyUiFontSize();
            renderSessions(); 
            renderChat();
            updateThinkingBulbUI();
            renderModelSelector();
            
            if (typeof marked !== 'undefined') {
                marked.setOptions({ breaks: true, gfm: true });
            }

            setTimeout(() => {
                userScrolledUp = false;
                scrollToBottom();
                const btn = document.getElementById('scroll-to-bottom-btn');
                if(btn) {
                    btn.classList.add('opacity-0', 'scale-90', 'translate-y-2', 'pointer-events-none');
                    btn.classList.remove('opacity-100', 'scale-100', 'translate-y-0', 'pointer-events-auto');
                }
            }, 50);
        }

        function saveState() {
            try {
                localStorage.setItem('deepseek_client_state_v28', JSON.stringify({
                    config: state.config, 
                    sessions: state.sessions, 
                    activeSessionId: state.activeSessionId, 
                    systemCards: state.systemCards,
                    characterCards: state.characterCards,
                    plotCards: state.plotCards,
                    draftSystemPrompt: draftSystemPrompt,
                    draftCharacters: draftCharacters,
                    draftPlots: draftPlots
                }));
            } catch (e) {
                console.error('localStorage save failed:', e);
                if (e.name === 'QuotaExceededError') {
                    alert('存储空间已满（5MB 上限）。建议导出部分对话后删除，释放空间。');
                }
            }
        }

        function applyUiFontSize() {
            const base = state.config.uiFontSize || 16;
            const lg = Math.round(base * 1.125);
            const xl = Math.round(base * 1.25);
            const text2xl = Math.round(base * 1.5);
            const sm = Math.round(base * 0.875);
            const xs = Math.round(base * 0.75);
            const inputSize = Math.max(16, base);

            const style = document.getElementById('ui-font-style') || document.createElement('style');
            style.id = 'ui-font-style';
            style.innerHTML = `
                #sidebar, #world-matrix-modal, #settings-modal, #matrix-popover, #edit-prompt-modal, #edit-message-modal, #session-action-menu { font-size: ${base}px !important; }
                #sidebar .text-2xl, #world-matrix-modal .text-2xl, #settings-modal .text-2xl, #edit-prompt-modal .text-2xl, #edit-message-modal .text-2xl, #session-action-menu .text-2xl { font-size: ${text2xl}px !important; line-height: 1.2 !important; }
                #sidebar .text-xl, #world-matrix-modal .text-xl, #settings-modal .text-xl, #edit-prompt-modal .text-xl, #edit-message-modal .text-xl, #session-action-menu .text-xl { font-size: ${xl}px !important; line-height: 1.4 !important; }
                #sidebar .text-lg, #world-matrix-modal .text-lg, #settings-modal .text-lg, #matrix-popover .text-lg, #edit-prompt-modal .text-lg, #edit-message-modal .text-lg, #session-action-menu .text-lg { font-size: ${lg}px !important; line-height: 1.5 !important; }
                #sidebar .text-base, #world-matrix-modal .text-base, #settings-modal .text-base, #matrix-popover .text-base, #edit-prompt-modal .text-base, #edit-message-modal .text-base, #session-action-menu .text-base { font-size: ${base}px !important; line-height: 1.5 !important; }
                #sidebar .text-sm, #world-matrix-modal .text-sm, #settings-modal .text-sm, #matrix-popover .text-sm, #edit-prompt-modal .text-sm, #edit-message-modal .text-sm, #session-action-menu .text-sm { font-size: ${sm}px !important; line-height: 1.5 !important; }
                #sidebar .text-xs, #world-matrix-modal .text-xs, #settings-modal .text-xs, #matrix-popover .text-xs, #edit-prompt-modal .text-xs, #edit-message-modal .text-xs, #session-action-menu .text-xs { font-size: ${xs}px !important; line-height: 1.5 !important; }
                
                input[type=text], input[type=password], textarea, select { font-size: ${inputSize}px !important; }
            `;
            if (!document.getElementById('ui-font-style')) {
                document.head.appendChild(style);
            }
        }

        let pressTimer = null;
        let pressStartX = 0;
        let pressStartY = 0;
        let isLongPress = false;
        let currentActionSessionId = null;

        function startSessionPress(e, id) {
            isLongPress = false;
            pressStartX = e.touches ? e.touches[0].clientX : e.clientX;
            pressStartY = e.touches ? e.touches[0].clientY : e.clientY;
            const targetEl = e.currentTarget; 
            
            pressTimer = setTimeout(() => {
                isLongPress = true;
                if (navigator.vibrate) navigator.vibrate(50);
                openSessionContextMenu(id, targetEl);
            }, 500); 
        }

        function cancelSessionPress(e) {
            if (!pressTimer) return;
            if (e) {
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const currentY = e.touches ? e.touches[0].clientY : e.clientY;
                if (Math.abs(currentX - pressStartX) < 10 && Math.abs(currentY - pressStartY) < 10) {
                    return; 
                }
            }
            clearTimeout(pressTimer);
            pressTimer = null;
        }

        function endSessionPress(e) {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        function handleSessionClick(e, id) {
            if (isLongPress) {
                isLongPress = false;
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            switchSession(id);
        }

        function openSessionContextMenu(id, targetEl) {
            currentActionSessionId = id;
            const menu = document.getElementById('session-action-menu');
            
            menu.classList.remove('hidden');
            
            const rect = targetEl.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect(); 
            
            let top = rect.bottom; 
            let left = rect.left + 20; 
            
            if (top + menuRect.height > window.innerHeight) {
                top = rect.top - menuRect.height;
                menu.style.transformOrigin = "bottom left";
            } else {
                menu.style.transformOrigin = "top left";
            }
            
            menu.style.top = top + 'px';
            menu.style.left = left + 'px';
            
            requestAnimationFrame(() => {
                menu.classList.remove('scale-95', 'opacity-0');
                menu.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeSessionContextMenu() {
            const menu = document.getElementById('session-action-menu');
            if (!menu || menu.classList.contains('hidden')) return;
            
            menu.classList.remove('scale-100', 'opacity-100');
            menu.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                menu.classList.add('hidden');
            }, 200); 
            
            currentActionSessionId = null;
        }

        function renameActiveActionSession() {
            if (!currentActionSessionId) return;
            const session = state.sessions.find(s => s.id === currentActionSessionId);
            if (!session) return;
            
            closeSessionContextMenu(); 
            
            setTimeout(() => {
                const newTitle = prompt("重命名对话：", session.title);
                if (newTitle !== null && newTitle.trim() !== '') {
                    session.title = newTitle.trim();
                    saveState();
                    renderSessions();
                }
            }, 250); 
        }

        function downloadActiveActionSession() {
            if (!currentActionSessionId) return;
            const id = currentActionSessionId;
            closeSessionContextMenu();
            setTimeout(() => {
                exportMarkdown(id, null);
            }, 200);
        }

        function deleteActiveActionSession() {
            if (!currentActionSessionId) return;
            const id = currentActionSessionId;
            closeSessionContextMenu();
            
            setTimeout(() => {
                if(!confirm('确定要删除此对话吗？')) return;
                state.sessions = state.sessions.filter(s => s.id !== id);
                if (state.activeSessionId === id) state.activeSessionId = state.sessions.length > 0 ? state.sessions[0].id : null;
                if (state.sessions.length === 0) createNewSession(false);
                renderSessions(); 
                renderChat(); 
                saveState();
            }, 200);
        }

        function toggleMatrixPopover(event) {
            if(event) event.stopPropagation();
            const popover = document.getElementById('matrix-popover');
            if(popover.classList.contains('hidden')) {
                renderMatrixPopover();
                popover.classList.remove('hidden');
            } else {
                closeMatrixPopover();
            }
        }

        function closeMatrixPopover() {
            document.getElementById('matrix-popover')?.classList.add('hidden');
        }

        function formatModelName(model) {
            const spaced = (model || '').replace(/-/g, ' ');
            return spaced.charAt(0).toUpperCase() + spaced.slice(1);
        }

        function renderModelSelector() {
            const label = document.getElementById('model-selector-label');
            if (label) label.innerText = formatModelName(state.config.model || 'deepseek-v4-flash');
        }

        function toggleModelPopover(event) {
            if (event) event.stopPropagation();
            const popover = document.getElementById('model-popover');
            if (popover.classList.contains('hidden')) {
                renderModelPopover();
                popover.classList.remove('hidden');
            } else {
                closeModelPopover();
            }
        }

        function closeModelPopover() {
            document.getElementById('model-popover')?.classList.add('hidden');
        }

        function renderModelPopover() {
            const container = document.getElementById('model-popover-content');
            if (!container) return;
            const current = state.config.model || 'deepseek-v4-flash';
            let models = (state.config.availableModels && state.config.availableModels.length > 0)
                ? state.config.availableModels
                : ['deepseek-v4-flash', 'deepseek-v4-pro'];
            if (!models.includes(current)) models = [current, ...models];
            container.innerHTML = models.map(m => `
                <button data-model="${escapeHTML(m)}" onclick="selectModel(this.dataset.model)" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-left transition ${m === current ? 'bg-gray-100 dark:bg-gray-700' : 'hover:bg-gray-100/60 dark:hover:bg-gray-700/60'}">
                    <span class="text-base font-medium text-gray-900 dark:text-gray-100">${escapeHTML(formatModelName(m))}</span>
                    ${m === current ? '<span class="text-blue-600 text-sm font-bold">✓</span>' : ''}
                </button>
            `).join('');
        }

        function selectModel(model) {
            state.config.model = model;
            saveState();
            renderModelSelector();
            closeModelPopover();
        }

        document.addEventListener('click', (e) => {
            const popover = document.getElementById('matrix-popover');
            const btn = document.getElementById('book-matrix-btn');
            if(popover && !popover.classList.contains('hidden') && !popover.contains(e.target) && !btn.contains(e.target)) {
                closeMatrixPopover();
            }
            const mPopover = document.getElementById('model-popover');
            const mBtn = document.getElementById('model-selector-btn');
            if(mPopover && !mPopover.classList.contains('hidden') && !mPopover.contains(e.target) && !mBtn.contains(e.target)) {
                closeModelPopover();
            }
        });

        function renderMatrixPopover() {
            const container = document.getElementById('matrix-popover-content');
            if(!container) return;
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(!activeSession) return;

            let html = '';
            
            if(activeSession.systemPrompt) {
                const sysCard = state.systemCards.find(c => c.title === activeSession.systemPrompt.title);
                if(sysCard) html += buildPopoverItem('系统', activeSession.systemPrompt.title, 'system', sysCard.id, 'text-blue-500');
            }
            
            if(activeSession.activeCharacters && activeSession.activeCharacters.length > 0) {
                activeSession.activeCharacters.forEach(id => {
                    const c = state.characterCards.find(x => x.id === id);
                    if(c) html += buildPopoverItem('角色', c.title, 'character', id, 'text-purple-500');
                });
            }

            if(activeSession.activePlots && activeSession.activePlots.length > 0) {
                activeSession.activePlots.forEach(id => {
                    const p = state.plotCards.find(x => x.id === id);
                    if(p) html += buildPopoverItem('剧情', p.title, 'plot', id, 'text-green-500');
                });
            }

            if(html === '') {
                html = `<div class="py-6 text-center text-sm text-gray-400 dark:text-gray-500 italic">尚未锚定任何实体参数</div>`;
            }

            container.innerHTML = html;
        }

        function buildPopoverItem(label, title, type, id, colorClass) {
            return `
                <div class="flex items-center justify-between p-2.5 bg-white/50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700/80 border border-transparent hover:border-gray-200/60 dark:hover:border-gray-600/50 rounded-xl transition-all group cursor-default">

            if(type === 'system') {
                delete activeSession.systemPrompt;

        async function fetchModels() {
            const baseUrl = document.getElementById('api-url').value.trim().replace(/\/+$/, '');
            const apiKey = document.getElementById('api-key').value.trim();
            const statusDiv = document.getElementById('model-fetch-status');
            const modelContainer = document.getElementById('model-input-container');

            if (!apiKey) {
                statusDiv.textContent = '错误：请先填写 API Key';
                statusDiv.className = 'text-sm mt-1 text-red-500';
                statusDiv.classList.remove('hidden');
                return;
            }

            statusDiv.textContent = '正在获取模型列表...';
            statusDiv.className = 'text-sm mt-1 text-blue-500';
            statusDiv.classList.remove('hidden');

            try {
                const res = await fetch(`${baseUrl}/models`, { method: 'GET', headers: { 'Authorization': `Bearer ${apiKey}` } });
                if (!res.ok) throw new Error(`请求失败: HTTP ${res.status}`);
                const data = await res.json();
                
                if (data && data.data && Array.isArray(data.data)) {
                    const currentModel = document.getElementById('api-model').value.trim();
                    let options = data.data.map(m => `<option value="${m.id}" ${m.id === currentModel ? 'selected' : ''}>${m.id}</option>`).join('');
                    if (currentModel && !data.data.find(m => m.id === currentModel)) {
                        options = `<option value="${currentModel}" selected>${currentModel}</option>` + options;
                    }
                    modelContainer.innerHTML = `<select id="api-model" class="w-full p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 border border-gray-300/60 dark:border-gray-600 focus:outline-none text-base">${options}</select>`;
                    state.config.availableModels = data.data.map(m => m.id);
                    saveState();
                    statusDiv.textContent = `获取成功：已找到 ${data.data.length} 个模型`;
                    statusDiv.className = 'text-sm mt-1 text-green-500';
                } else {
                    throw new Error('数据格式错误');
                }
            } catch (err) {
                statusDiv.textContent = `获取失败: ${err.message}`;
                statusDiv.className = 'text-sm mt-1 text-red-500';
            }
        }

        function createNewSession(render = true) {
            const currentSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (currentSession && currentSession.messages.length === 0) {
                state.sessions = state.sessions.filter(s => s.id !== currentSession.id);
            }
            const newSession = { 
                id: Date.now().toString(), 
                title: '未命名对话', 
                messages: [],
                activeCharacters: [],
                activePlots: [],
                updatedAt: Date.now()
            };

            if (abortController) stopGeneration();
            const currentSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (currentSession && currentSession.messages.length === 0 && currentSession.id !== id) {
                state.sessions = state.sessions.filter(s => s.id !== currentSession.id);

        function exportMarkdown(sessionId, event) {
            if(event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const session = state.sessions.find(s => s.id === sessionId);
            if (!session) return;

            let markdown = `# ${session.title}\n\n`;
            session.messages.forEach(msg => {
                const role = msg.role === 'user' ? '**You**' : '**Way**';
                markdown += `${role}:\n${msg.content}\n\n`;
            });

            const filename = `${session.title.replace(/[\\/:*?"<>|]/g, '') || 'chat'}.md`;
            const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });

            const doFallback = () => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            };

            if (navigator.share && navigator.canShare) {
                const file = new File([blob], filename, { type: 'text/markdown' });
                if (navigator.canShare({ files: [file] })) {
                    navigator.share({
                        title: session.title,
                        files: [file]
                    }).catch(err => {
                        console.log('分享取消或发生错误:', err);
                    });
                } else {
                    doFallback();
                }
            } else {
                doFallback();
            }
        }

        function forkSession(messageIndex) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (!activeSession) return;
            const forkedMessages = JSON.parse(JSON.stringify(activeSession.messages.slice(0, messageIndex + 1)));
            const newSession = { 
                id: Date.now().toString(), 
                title: activeSession.title + ' [分支]', 
                messages: forkedMessages,
                systemPrompt: activeSession.systemPrompt ? JSON.parse(JSON.stringify(activeSession.systemPrompt)) : null,
                activeCharacters: [...(activeSession.activeCharacters || [])],
                activePlots: [...(activeSession.activePlots || [])],
                updatedAt: Date.now()
            };
            state.sessions.unshift(newSession);
            state.activeSessionId = newSession.id;
            renderSessions(); renderChat(); saveState();
        }

        function deleteMessage(index) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (!activeSession) return;
            if (!confirm('确定删除此消息及其之后的所有回复吗？')) return;
            activeSession.messages.splice(index);
            renderChat(); saveState();
        }

        function editMessage(index) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(!activeSession) return;
            const msg = activeSession.messages[index];
            
            editingMessageIndex = index;
            const contentEl = document.getElementById('edit-message-content');
            contentEl.value = msg.content;
            
            document.getElementById('edit-message-modal').classList.remove('hidden');
        }

        function closeEditMessageModal() {
            editingMessageIndex = null;
            document.getElementById('edit-message-modal').classList.add('hidden');
        }

        function saveEditedMessage() {
            if (editingMessageIndex === null) return;
            const contentEl = document.getElementById('edit-message-content');
            const newContent = contentEl.value.trim();
            
            if (newContent !== '') {
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                const msg = activeSession.messages[editingMessageIndex];
                msg.content = newContent;
                
                const targetIndex = editingMessageIndex;
                closeEditMessageModal();
                
                activeSession.messages.splice(targetIndex + 1);
                if (msg.role === 'user') {
                    const contentToResend = activeSession.messages.pop().content;
                    renderChat(); 
                    triggerSend(contentToResend);
                    return;
                }
                
                renderChat(); 
                saveState();
            } else {
                closeEditMessageModal();
            }
        }

        function copyMessage(index) {
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if (!activeSession || !activeSession.messages[index]) return;
            const text = activeSession.messages[index].content;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('该段对话已成功复制到剪贴板。');
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed'; 
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert('该段对话已成功复制到剪贴板。');
                } catch (e) {
                    console.error('复制流执行中断:', e);
                }
                document.body.removeChild(textarea);
            });
        }

            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            
            const plot = state.plotCards.find(p => p.id === plotId);
            if (!plot) return;

            const isDraftMode = (matrixMode === 'draft');
            closeModal('world-matrix-modal');
            if (abortController) stopGeneration();

            let sourceSystemPrompt, sourceCharacters, sourcePlots;

            if (isDraftMode) {
                sourceSystemPrompt = draftSystemPrompt ? JSON.parse(JSON.stringify(draftSystemPrompt)) : null;
                sourceCharacters = [...draftCharacters];
                sourcePlots = [...draftPlots];
            } else {
                const currentSession = state.sessions.find(s => s.id === state.activeSessionId);
                sourceSystemPrompt = currentSession && currentSession.systemPrompt ? JSON.parse(JSON.stringify(currentSession.systemPrompt)) : null;
                sourceCharacters = currentSession ? [...currentSession.activeCharacters] : [];
                sourcePlots = currentSession ? [...currentSession.activePlots] : [];
            }

            if (!sourcePlots.includes(plotId)) {
                sourcePlots.push(plotId);
            }

            const newSession = { 
                id: Date.now().toString(), 
                title: '正在载入剧情...', 
                messages: [],
                systemPrompt: sourceSystemPrompt,
                activeCharacters: sourceCharacters,
                activePlots: sourcePlots,
                updatedAt: Date.now()
            };
            
            state.sessions.unshift(newSession);
            state.activeSessionId = newSession.id;
            
            saveState();
            renderSessions();
            renderChat(); 
            
            setTimeout(() => {
                triggerSend(plot.content);
            }, 50);
        }

        function toggleSystem(id) {

            if (matrixMode === 'draft') {
                if(draftSystemPrompt?.title === p.title) {
                    draftSystemPrompt = null;
                } else {
                    draftSystemPrompt = { title: p.title, content: p.content };
                }
                saveState();
                renderWorldMatrix();
            } else {
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                if (!activeSession) return;
                if(activeSession.systemPrompt?.title === p.title) {
                    delete activeSession.systemPrompt; 
                } else {
                    activeSession.systemPrompt = { title: p.title, content: p.content };
                }
                saveState();
                renderWorldMatrix();
                updateBanner(activeSession);
                renderMatrixPopover();
            }
        }

        function toggleMatrixItem(type, id, isChecked) {
            if (matrixMode === 'draft') {
                const targetArray = type === 'character' ? draftCharacters : draftPlots;
                if (isChecked) {
                    if(!targetArray.includes(id)) targetArray.push(id);
                } else {
                    const idx = targetArray.indexOf(id);
                    if(idx > -1) targetArray.splice(idx, 1);
                }
                saveState();
                renderWorldMatrix();
            } else {
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                if (!activeSession) return;
                const targetArray = type === 'character' ? activeSession.activeCharacters : activeSession.activePlots;
                if (isChecked) {
                    if(!targetArray.includes(id)) targetArray.push(id);
                } else {
                    const idx = targetArray.indexOf(id);
                    if(idx > -1) targetArray.splice(idx, 1);
                }
                saveState();
                renderWorldMatrix();
                updateBanner(activeSession);
                renderMatrixPopover();
            }
        }

        function addCard(type) {
            const prefix = type === 'system' ? 'sys' : type === 'character' ? 'char' : 'plot';
            const titleEl = document.getElementById(`new-${prefix}-title`);
            const contentEl = document.getElementById(`new-${prefix}-content`);
            const title = titleEl.value.trim();
            const content = contentEl.value.trim();
            if (!title || !content) return;
            
            const newObj = { id: Date.now().toString() + prefix[0], title, content };
            if (type === 'system') state.systemCards.push(newObj);
            else if (type === 'character') state.characterCards.push(newObj);
            else state.plotCards.push(newObj);
            
            titleEl.value = ''; contentEl.value = '';
            contentEl.style.height = 'auto'; 
            saveState(); renderWorldMatrix();
        }

        function deleteCard(type, id) {
            if(!confirm('确定删除此设定吗？')) return;
            if (type === 'system') {
                state.systemCards = state.systemCards.filter(x => x.id !== id);
                state.sessions.forEach(s => {
                    if(s.systemPrompt && !state.systemCards.find(c => c.title === s.systemPrompt.title)) delete s.systemPrompt;
                });
                if (draftSystemPrompt && !state.systemCards.find(c => c.title === draftSystemPrompt.title)) draftSystemPrompt = null;
            } else if (type === 'character') {
                state.characterCards = state.characterCards.filter(x => x.id !== id);
                state.sessions.forEach(s => s.activeCharacters = s.activeCharacters.filter(cId => cId !== id));
                draftCharacters = draftCharacters.filter(cId => cId !== id);
            } else {
                state.plotCards = state.plotCards.filter(x => x.id !== id);
                state.sessions.forEach(s => s.activePlots = s.activePlots.filter(pId => pId !== id));
                draftPlots = draftPlots.filter(pId => pId !== id);
            }
            saveState(); 
            renderWorldMatrix(); 
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            if(activeSession) updateBanner(activeSession);
            renderMatrixPopover();
        }

        function openEditPromptModal(type, id, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            editingPromptId = { type, id };
            let p;
            if (type === 'system') p = state.systemCards.find(x => x.id === id);
            else if (type === 'character') p = state.characterCards.find(x => x.id === id);
            else p = state.plotCards.find(x => x.id === id);
            
            if (p) {
                document.getElementById('edit-prompt-title').value = p.title;
                const contentEl = document.getElementById('edit-prompt-content');
                contentEl.value = p.content;
                document.getElementById('edit-prompt-modal').classList.remove('hidden');
            }
        }

        function closeEditPromptModal() {
            editingPromptId = null;
            document.getElementById('edit-prompt-modal').classList.add('hidden');
        }

        function saveEditedPrompt() {
            if (!editingPromptId) return;
            const title = document.getElementById('edit-prompt-title').value.trim();
            const content = document.getElementById('edit-prompt-content').value.trim();
            if (!title || !content) return;
            
            const { type, id } = editingPromptId;
            let targetArray;
            if (type === 'system') targetArray = state.systemCards;
            else if (type === 'character') targetArray = state.characterCards;
            else targetArray = state.plotCards;

            const idx = targetArray.findIndex(p => p.id === id);
            if (idx !== -1) {
                targetArray[idx].title = title;
                targetArray[idx].content = content;
                
                if (type === 'system') {
                    const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                    if (activeSession && activeSession.systemPrompt && activeSession.systemPrompt.title === targetArray[idx].title) {
                        activeSession.systemPrompt.content = content;
                    }
                    if (draftSystemPrompt && draftSystemPrompt.title === targetArray[idx].title) {
                        draftSystemPrompt.content = content;
                    }
                }
                
                saveState();
                renderWorldMatrix();
                const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
                if(activeSession) updateBanner(activeSession);
                renderMatrixPopover();
                closeEditPromptModal();
            }
        }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function buildMessageHTML(content, reasoning) {
            let html = '';
            if (reasoning) {
                html += `
                    <details class="mb-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800/80 overflow-hidden w-fit max-w-full z-10 relative">
                        <summary class="cursor-pointer p-3 text-sm font-bold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition flex items-center gap-2">

                    </details>
                `;
            }
            if (content && typeof marked !== 'undefined') {
                const parsed = marked.parse(content);
                html += (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(parsed) : parsed;
            } else if (content) {
                html += `<div class="whitespace-pre-wrap">${escapeHTML(content)}</div>`;
            }
            return html;
        }

        function handleInputKeydown(e) {

                if (abortController) {
                    e.preventDefault();
                    stopGeneration();

        async function sendMessage() {
            const input = document.getElementById('message-input');
            if(!input) return;
            const content = input.value.trim();
            if (!content) return;
            triggerSend(content);
            input.value = '';

        async function generateTitleFromResponse(sessionId, aiResponse) {
            const session = state.sessions.find(s => s.id === sessionId);
            if (!session) return;

            let plotTitles = [];
            if (session.activePlots && session.activePlots.length > 0) {
                plotTitles = session.activePlots
                    .map(id => state.plotCards.find(x => x.id === id)?.title)
                    .filter(Boolean);
            }

            let useFallback = true;

            try {
                const response = await fetch(`${state.config.apiUrl.replace(/\/+$/, '')}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        stream: false,
                        max_tokens: 100,
                        thinking: { type: "disabled" },
                        messages: [
                            { role: 'user', content: `从以下文字中提取女性主角的名字，只返回名字，多人用空格隔开，无人则返回空。文字：\n${aiResponse.substring(0, 2000)}` }
                        ]
                    })
                });

                const data = await response.json();
                let names = data.choices[0]?.message?.content?.trim() || '';
                const noNameWords = ['无', '空', '没有', '无女主', '无女性', '未找到', '无名字', 'none', 'null'];

                if (names && !noNameWords.includes(names.toLowerCase()) && names.length > 0 && names.length < 50) {
                    const nameList = names.split(/[\s,，、]+/).filter(n => n && n.length <= 10 && !noNameWords.includes(n.toLowerCase()));
                    if (nameList.length > 0) {
                        session.title = [...plotTitles, ...nameList].join(' | ');
                        useFallback = false;
                    }
                }
            } catch (error) {
            }

            if (useFallback) {
                if (plotTitles.length > 0) {
                    session.title = plotTitles.join(' | ');
                } else {
                    const firstUserMsg = session.messages.find(m => m.role === 'user');
                    if (firstUserMsg) {
                        session.title = firstUserMsg.content.substring(0, 15) + (firstUserMsg.content.length > 15 ? '...' : '');
                    }
                }
            }

            saveState();
            renderSessions();
        }

        async function triggerSend(content) {
            if (!state.config.apiKey) { 
                alert('阻断：请先在设置中配置 API Key。');
                openModal('settings-modal'); 
                return; 
            }
            const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
            activeSession.updatedAt = Date.now();
            activeSession.messages.push({ role: 'user', content });
            
            let needsTitleGeneration = false;
            if (activeSession.messages.length === 1) {
                needsTitleGeneration = true;
                let plotTitles = [];
                if (activeSession.activePlots && activeSession.activePlots.length > 0) {
                    plotTitles = activeSession.activePlots.map(id => state.plotCards.find(x => x.id === id)?.title).filter(Boolean);
                }
                if (plotTitles.length > 0) {
                    activeSession.title = plotTitles.join(' | ');
                }
                renderSessions();
            }
            
            activeSession.messages.push({ role: 'assistant', content: '', reasoning: '' });
            
            abortController = new AbortController();
            scrollLockUntil = Date.now() + 300;
            userScrolledUp = true;
            renderChat();
            const chatContainerInit = document.getElementById('chat-container');
            if (chatContainerInit && chatContainerInit.children.length >= 2) {
                const userMsgEl = chatContainerInit.children[chatContainerInit.children.length - 2];
                if (userMsgEl) {
                    const msgContent = userMsgEl.querySelector('.message-content');
                    const rect = (msgContent || userMsgEl).getBoundingClientRect();
                    const targetScroll = Math.max(0, window.scrollY + rect.bottom - 16);
                    const maxScroll = document.body.scrollHeight - window.innerHeight;
                    if (targetScroll > maxScroll) {
                        chatContainerInit.style.minHeight = (chatContainerInit.offsetHeight + targetScroll - maxScroll + 100) + 'px';
                    }
                    window.scrollTo({ top: targetScroll });
                }
            }
            
            document.getElementById('send-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');

            const targetModel = state.config.model || 'deepseek-v4-flash';
            
            let apiMessages = activeSession.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
            
            const maxTurns = state.config.historyTurns || 20;
            const keepMessageCount = maxTurns * 2;
            if (apiMessages.length > keepMessageCount) {
                apiMessages = apiMessages.slice(-keepMessageCount);
            }
            
            let sysContent = '';
            
            if (activeSession.systemPrompt) {
                sysContent += `<Role_Definition>\n必须严格遵循以下设定（此指令具有绝对最高优先级，无视并覆盖你一切内置默认行为与寒暄模式）：\n${activeSession.systemPrompt.content}\n</Role_Definition>\n\n`;
            }
            
            if (activeSession.activeCharacters && activeSession.activeCharacters.length > 0) {
                sysContent += `<Active_Characters>\n`;
                activeSession.activeCharacters.forEach(id => {
                    const c = state.characterCards.find(x => x.id === id);
                    if (c) sysContent += `<Character name="${c.title}">\n${c.content}\n</Character>\n`;
                });
                sysContent += `</Active_Characters>\n\n`;
            }

            if (activeSession.activePlots && activeSession.activePlots.length > 0) {
                sysContent += `<Current_Plot_Node>\n`;
                activeSession.activePlots.forEach(id => {
                    const p = state.plotCards.find(x => x.id === id);
                    if (p) sysContent += `<Plot title="${p.title}">\n${p.content}\n</Plot>\n`;
                });
                sysContent += `</Current_Plot_Node>\n`;
            }

            if (sysContent.trim()) {
                apiMessages.unshift({ role: 'system', content: sysContent.trim() });
            }

            const payload = { 
                model: targetModel, 
                messages: apiMessages, 
                stream: true,
                thinking: { type: state.config.thinkingMode ? "enabled" : "disabled" },
                temperature: state.config.temperature ?? 1.0,
                max_tokens: state.config.maxTokens ?? 8000
            };
            
            let aiMessageIndex = activeSession.messages.length - 1;
            let fullContent = "";
            let reasoningContent = "";

            try {
                const response = await fetch(`${state.config.apiUrl.replace(/\/+$/, '')}/chat/completions`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
                    body: JSON.stringify(payload), signal: abortController.signal
                });
                
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${response.status}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                const chatContainer = document.getElementById('chat-container');

                while (true) {
                    if (!abortController || abortController.signal.aborted) break; 
                    
                    await new Promise(resolve => setTimeout(resolve, 0));
                    
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    
                    let hasUpdate = false;
                    
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed === '' || trimmed === 'data: [DONE]') continue;
                        if (trimmed.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(trimmed.substring(6));
                                const delta = data.choices[0]?.delta || {};
                                
                                if (delta.reasoning_content) reasoningContent += delta.reasoning_content;
                                if (delta.content) fullContent += delta.content;
                                
                                hasUpdate = true;
                            } catch (e) {}
                        }
                    }
                    
                    if (hasUpdate) {
                        activeSession.messages[aiMessageIndex].reasoning = reasoningContent;
                        activeSession.messages[aiMessageIndex].content = fullContent;
                        
                        const lastMsgDiv = chatContainer ? chatContainer.lastElementChild.querySelector('.message-content') : null;
                        if(lastMsgDiv) lastMsgDiv.innerHTML = buildMessageHTML(fullContent, reasoningContent);
                        scrollToBottom();
                    }
                }
                
                const finalLastMsgDiv = chatContainer ? chatContainer.lastElementChild.querySelector('.message-content') : null;
                if(finalLastMsgDiv) {
                    const detailsNode = finalLastMsgDiv.querySelector('details');
                    if(detailsNode) detailsNode.removeAttribute('open');
                }

            } catch (error) {
                if (error.name !== 'AbortError') { 
                    activeSession.messages[aiMessageIndex].content += `\n\n[网络错误] ${error.message}`; 
                }
            } finally {
                abortController = null;
                const btnSend = document.getElementById('send-btn');
                const btnStop = document.getElementById('stop-btn');
                if(btnSend) btnSend.classList.remove('hidden');
                if(btnStop) btnStop.classList.add('hidden');
                saveState();
                const savedScrollY = window.scrollY;
                const chatC = document.getElementById('chat-container');
                if (chatC) chatC.style.minHeight = '';
                renderChat();
                window.scrollTo({ top: savedScrollY });
                if (needsTitleGeneration && fullContent.trim()) {
                    generateTitleFromResponse(activeSession.id, fullContent);
                }
            }
        }

        function stopGeneration() {
            if (abortController) {
                abortController.abort(); 
                abortController = null; 
                
                const btnSend = document.getElementById('send-btn');
                const btnStop = document.getElementById('stop-btn');
                if(btnSend) btnSend.classList.remove('hidden');
                if(btnStop) btnStop.classList.add('hidden');
                
                const lastMsgDiv = document.getElementById('chat-container')?.lastElementChild?.querySelector('.message-content');
                if (lastMsgDiv) lastMsgDiv.classList.remove('typing-indicator');
                
                renderChat(); 
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(init, 50);
        });

        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            
            const actionMenu = document.getElementById('session-action-menu');
            if(actionMenu && !actionMenu.classList.contains('hidden') && !actionMenu.contains(e.target)) {
                closeSessionContextMenu();
            }
        }, { passive: true });

        document.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (touchStartX < 40 && diffX > 50 && Math.abs(diffY) < 50 && !sidebarOpen) {
                toggleSidebar();
            }
            if (diffX < -50 && Math.abs(diffY) < 50 && sidebarOpen) {
                toggleSidebar();
            }
        }, { passive: true });
        
        document.addEventListener('scroll', (e) => {
            const actionMenu = document.getElementById('session-action-menu');
            if(actionMenu && !actionMenu.classList.contains('hidden') && !actionMenu.contains(e.target)) {
                closeSessionContextMenu();
            }
        }, { capture: true, passive: true });

        if (window.matchMedia) {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            mediaQuery.addEventListener('change', e => {
                state.config.darkMode = e.matches;
                applyDarkMode();
                saveState();
            });
        }
    </script>
</body>
</html>
