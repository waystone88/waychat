<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>交易决策提示系统</title>
    <style>
        /* CSS Reset & Variable Definitions */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        @page {
            size: A4;
            margin: 0;
            background-color: #f4f5f7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f5f7;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            display: block;
            position: relative;
            padding: 16px 16px calc(20px + env(safe-area-inset-bottom)) 16px;
        }

        /* Top Header Metadata */
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 11pt;
            color: #666666;
        }
        .header-left {
            font-weight: 500;
        }
        .header-right {
            color: #fa8c16;
            font-weight: bold;
            font-size: 10pt;
            background: rgba(250, 140, 22, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #fa8c16;
            margin-right: 4px;
        }
        .status-live { background-color: #52c41a; }
        .status-closed { background-color: #888888; }
        .text-live { color: #52c41a; background: rgba(82, 196, 26, 0.1); }
        .text-closed { color: #888888; background: rgba(136, 136, 136, 0.1); }

        /* Market Indices Grid */
        .market-grid {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .market-card {
            flex: 1;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 14px 4px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .index-name {
            font-size: 9.5pt;
            color: #888888;
            margin-bottom: 4px;
        }
        .index-value {
            font-size: 13pt;
            font-weight: bold;
            font-family: 'SF Pro Display', 'Times New Roman', serif;
            transition: color 0.3s ease;
        }
        .index-change {
            font-size: 9pt;
            margin-top: 4px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        /* A-Share Color Code: Red Up, Green Down */
        .color-up { color: #f2334e; }
        .color-down { color: #00a86b; }
        .color-flat { color: #888888; }

        /* ADVANCE/DECLINE STATS PANEL */
        .stats-panel {
            background-color: #ffffff;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        .stats-title {
            font-size: 11pt;
            color: #333333;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .stats-subtitle {
            font-size: 9pt;
            color: #999999;
            font-weight: normal;
        }
        .ratio-bar-container {
            width: 100%;
            height: 12px;
            background-color: #00a86b; /* Green for decline */
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }
        .ratio-bar-fill {
            height: 100%;
            width: 50%;
            background-color: #f2334e; /* Red for advance */
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 2px solid #ffffff;
        }
        .ratio-numbers {
            display: flex;
            justify-content: space-between;
            font-size: 10.5pt;
        }
        .stat-up { color: #f2334e; font-weight: bold; }
        .stat-flat { color: #999999; }
        .stat-down { color: #00a86b; font-weight: bold; }

        /* HISTORICAL CHART CONTAINER */
        .chart-container {
            background-color: #ffffff;
            border-radius: 14px;
            padding: 16px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        .chart-header {
            font-size: 11pt;
            color: #333333;
            font-weight: 600;
            margin-bottom: 12px;
            padding-left: 4px;
        }
        .svg-chart-wrapper {
            width: 100%;
            height: 160px;
            position: relative;
        }

        /* ADVICE CARD PANEL */
        .advice-panel {
            background-color: #fffbe6;
            border-left: 4px solid #faad14;
            border-radius: 6px 12px 12px 6px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #ffe58f;
            border-left: 4px solid #faad14;
        }
        .advice-tag {
            font-size: 9.5pt;
            color: #d46b08;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .advice-tag::before {
            content: "💡";
            margin-right: 4px;
        }
        .advice-text {
            font-size: 11pt;
            color: #595959;
            font-weight: 500;
            text-align: justify;
            line-height: 1.5;
        }

        /* ACTION BUTTONS DOCK */
        .action-dock {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 16px 0;
            border-radius: 14px;
            font-size: 13pt;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        .btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        .btn-buy {
            background-color: #f2334e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(242, 51, 78, 0.25);
            border: none;
        }
        .btn-hold {
            background-color: #ffffff;
            color: #595959;
            border: 1px solid #d9d9d9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Area -->
    <div class="header-meta">
        <div class="header-left" id="current-date">加载中...</div>
        <div class="header-right" id="market-status-badge">
            <span class="status-dot" id="market-dot"></span>
            <span id="market-status-text">连接中</span>
        </div>
    </div>

    <!-- Market Indices Grid -->
    <div class="market-grid">
        <div class="market-card">
            <div class="index-name">上证指数</div>
            <div class="index-value color-flat" id="sh-price">--.--</div>
            <div class="index-change color-flat" id="sh-change">--.--%</div>
        </div>
        <div class="market-card">
            <div class="index-name">深证成指</div>
            <div class="index-value color-flat" id="sz-price">--.--</div>
            <div class="index-change color-flat" id="sz-change">--.--%</div>
        </div>
        <div class="market-card">
            <div class="index-name">创业板指</div>
            <div class="index-value color-flat" id="cyb-price">--.--</div>
            <div class="index-change color-flat" id="cyb-change">--.--%</div>
        </div>
    </div>

    <!-- Advance / Decline Stats Panel -->
    <div class="stats-panel">
        <div class="stats-title">
            <span>A股涨跌家数 (真实数据)</span>
            <span class="stats-subtitle" id="breadth-time">--:-- 更新</span>
        </div>
        <div class="ratio-bar-container">
            <div class="ratio-bar-fill" id="ratio-fill" style="width: 50%;"></div>
        </div>
        <div class="ratio-numbers">
            <div class="stat-up" id="stat-up-text">涨 ----</div>
            <div class="stat-flat" id="stat-flat-text">平 --</div>
            <div class="stat-down" id="stat-down-text">跌 ----</div>
        </div>
    </div>

    <!-- Historical Chart Area -->
    <div class="chart-container">
        <div class="chart-header">历史收盘上涨家数轨迹</div>
        <div class="svg-chart-wrapper">
            <svg viewBox="0 0 380 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <line x1="25" y1="20" x2="370" y2="20" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="25" y1="55" x2="370" y2="55" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="25" y1="90" x2="370" y2="90" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="25" y1="125" x2="370" y2="125" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="2,2"/>
                
                <text x="20" y="24" fill="#999999" font-size="9" text-anchor="end">4000</text>
                <text x="20" y="59" fill="#999999" font-size="9" text-anchor="end">3000</text>
                <text x="20" y="94" fill="#999999" font-size="9" text-anchor="end">2000</text>
                <text x="20" y="129" fill="#999999" font-size="9" text-anchor="end">1000</text>
                
                <line x1="25" y1="125" x2="370" y2="125" stroke="#1890ff" stroke-width="1.5" stroke-dasharray="4,4"/>
                
                <polyline fill="none" stroke="#f2334e" stroke-width="2" stroke-linejoin="round"
                    points="30,115 45,35 60,135 75,105 90,75 105,25 120,110 135,145 150,18 165,82 180,120 195,132 210,42 225,122 240,22 255,122 270,112 285,128 300,32 315,142 330,65 345,95 360,40" />
                
                <g fill="#ffffff" stroke="#f2334e" stroke-width="1.5">
                    <circle cx="30" cy="115" r="2.5"/> <circle cx="45" cy="35" r="2.5"/> <circle cx="60" cy="135" r="2.5"/>
                    <circle cx="75" cy="105" r="2.5"/> <circle cx="90" cy="75" r="2.5"/> <circle cx="105" cy="25" r="2.5"/>
                    <circle cx="120" cy="110" r="2.5"/> <circle cx="135" cy="145" r="2.5"/> <circle cx="150" cy="18" r="2.5"/>
                    <circle cx="165" cy="82" r="2.5"/> <circle cx="180" cy="120" r="2.5"/> <circle cx="195" cy="132" r="2.5"/>
                    <circle cx="210" cy="42" r="2.5"/> <circle cx="225" cy="122" r="2.5"/> <circle cx="240" cy="22" r="2.5"/>
                    <circle cx="255" cy="122" r="2.5"/> <circle cx="270" cy="112" r="2.5"/> <circle cx="285" cy="128" r="2.5"/>
                    <circle cx="300" cy="32" r="2.5"/> <circle cx="315" cy="142" r="2.5"/> <circle cx="330" cy="65" r="2.5"/>
                    <circle cx="345" cy="95" r="2.5"/> <circle cx="360" cy="40" r="2.5"/>
                </g>
            </svg>
        </div>
    </div>

    <!-- Custom Personalized Advice Card Component -->
    <div class="advice-panel">
        <div class="advice-tag">日内交易心法</div>
        <div class="advice-text" id="advice-text">
            系统正在分析今日盘面...
        </div>
    </div>

    <!-- Two-Button Decision Dock Area -->
    <div class="action-dock">
        <div class="btn btn-buy" onclick="alert('执行交易纪律检查清单！请确认是否满足买入条件。')">确认买入</div>
        <div class="btn btn-hold" onclick="alert('知行合一。管住手就是最好的操作。')">空仓观望</div>
    </div>
</div>

<script>
    const COLOR_UP = '#f2334e';
    const COLOR_DOWN = '#00a86b';
    const COLOR_FLAT = '#888888';
    
    let hasLoadedOnce = false;

    // 1. 判断是否在A股交易时间段 (9:25-11:30, 13:00-15:02)
    function isTradingTime() {
        const now = new Date();
        const day = now.getDay();
        // 周末休市
        if (day === 0 || day === 6) return false;
        
        const timeNum = now.getHours() * 100 + now.getMinutes();
        // 早盘 (包含集合竞价)
        if (timeNum >= 925 && timeNum <= 1130) return true;
        // 午盘 (放宽到15:02以获取收盘最终数据)
        if (timeNum >= 1300 && timeNum <= 1502) return true;
        
        return false;
    }

    // 2. 更新头部状态和日期
    function updateHeaderStatus() {
        const now = new Date();
        const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        document.getElementById('current-date').innerText = 
            `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${days[now.getDay()]}`;

        const badge = document.getElementById('market-status-badge');
        const dot = document.getElementById('market-dot');
        const text = document.getElementById('market-status-text');

        if (isTradingTime()) {
            badge.className = 'header-right text-live';
            dot.className = 'status-dot status-live';
            text.innerText = '盘中实时';
        } else {
            badge.className = 'header-right text-closed';
            dot.className = 'status-dot status-closed';
            text.innerText = '休盘/未开盘';
        }
    }

    // 3. 抓取大盘指数 (腾讯接口)
    function fetchLiveIndexData() {
        if (!isTradingTime() && hasLoadedOnce) return; // 非交易时间且已加载过，不发请求

        const script = document.createElement('script');
        script.src = 'https://qt.gtimg.cn/q=s_sh000001,s_sz399001,s_sz399006&r=' + Math.random();
        
        script.onload = function() {
            try {
                if(window.v_s_sh000001) renderIndex('sh', window.v_s_sh000001);
                if(window.v_s_sz399001) renderIndex('sz', window.v_s_sz399001);
                if(window.v_s_sz399006) renderIndex('cyb', window.v_s_sz399006);
            } catch (e) { console.error("Index parse error", e); }
            document.head.removeChild(script);
        };
        document.head.appendChild(script);
    }

    function renderIndex(id_prefix, data_str) {
        const parts = data_str.split('~');
        if (parts.length >= 6) {
            const price = parseFloat(parts[3]).toFixed(2);
            const changeVal = parseFloat(parts[4]);
            const changePct = parseFloat(parts[5]);
            
            const priceEl = document.getElementById(id_prefix + '-price');
            const changeEl = document.getElementById(id_prefix + '-change');
            
            priceEl.innerText = price;
            changeEl.innerText = (changeVal > 0 ? '+' : '') + changePct.toFixed(2) + '%';
            
            let color = COLOR_FLAT;
            if (changeVal > 0) color = COLOR_UP;
            else if (changeVal < 0) color = COLOR_DOWN;
            
            priceEl.style.color = color;
            changeEl.style.color = color;
        }
    }

    // 4. 抓取真实的涨跌家数 (东方财富接口)
    function fetchMarketBreadth() {
        if (!isTradingTime() && hasLoadedOnce) return;

        const script = document.createElement('script');
        // 东财接口: 1.000001(上证), 0.399001(深证), f104(涨), f105(跌), f106(平)
        const cbName = 'handleBreadth_' + new Date().getTime();
        script.src = `https://push2.eastmoney.com/api/qt/ulist.np/get?cb=${cbName}&fltt=2&secids=1.000001,0.399001&fields=f104,f105,f106&_=${new Date().getTime()}`;
        
        window[cbName] = function(data) {
            try {
                if (data && data.data && data.data.diff) {
                    let up = 0, down = 0, flat = 0;
                    data.data.diff.forEach(market => {
                        if (market.f104) up += market.f104;
                        if (market.f105) down += market.f105;
                        if (market.f106) flat += market.f106;
                    });
                    
                    updateBreadthUI(up, down, flat);
                    hasLoadedOnce = true; // 标记已成功加载一次真实数据
                }
            } catch (e) {
                console.error("Breadth parse error", e);
            }
            document.head.removeChild(script);
            delete window[cbName];
        };
        document.head.appendChild(script);
    }

    function updateBreadthUI(up, down, flat) {
        document.getElementById('stat-up-text').innerText = `涨 ${up}`;
        document.getElementById('stat-flat-text').innerText = `平 ${flat}`;
        document.getElementById('stat-down-text').innerText = `跌 ${down}`;
        
        const total = up + down; // 忽略平盘计算比例更直观
        const upRatio = total > 0 ? (up / total) * 100 : 50;
        document.getElementById('ratio-fill').style.width = upRatio + '%';

        const now = new Date();
        document.getElementById('breadth-time').innerText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} 更新`;

        // 根据真实数据更新心法
        const adviceBox = document.getElementById('advice-text');
        if (up > 3500) {
            adviceBox.innerHTML = "情绪极度高潮，普涨格局已成。<b>切勿在此处头脑发热追高跟风票</b>，手中有利润的注意逢高分批止盈。";
            adviceBox.style.color = COLOR_UP;
        } else if (up < 1000) {
            adviceBox.innerHTML = "市场处于冰点极寒期，赚钱效应极差。<b>严格执行空仓纪律！</b>不要抱有抄底侥幸心理，耐心等待历史曲线企稳。";
            adviceBox.style.color = COLOR_DOWN;
        } else {
            adviceBox.innerHTML = "指数震荡，市场分化严重。仅关注具备核心逻辑的主线龙头。<b>看不懂就不做，空仓也是一种完美的交易。</b>";
            adviceBox.style.color = "#595959";
        }
    }

    // 初始化执行
    updateHeaderStatus();
    fetchLiveIndexData();
    fetchMarketBreadth();

    // 定时器：每5秒执行一次（内部会判断是否在交易时间）
    setInterval(() => {
        updateHeaderStatus();
        fetchLiveIndexData();
        fetchMarketBreadth();
    }, 5000);

</script>

</body>
</html>
